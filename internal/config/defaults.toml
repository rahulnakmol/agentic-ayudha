# Default configuration embedded in the aayudha binary (docs/BUILD-PLAN.md WP0.5).
#
# This is the base configuration layer. WP1.2 layers the user, repository, local, environment, and flag
# layers on top of it. CONSTRAINTS.md is generated from this file by `go generate ./...`: change a value
# here, regenerate, and commit both. The generator (internal/config/gen) holds the meaning and plan source
# of every key it renders and fails when a key is added or removed without updating it.

# Floors run by `verify` (rule 7: no model disposition can override a floor miss).
[verify]
# DAST on by default for web and api platforms (Decision #485): active rules only against an app verify starts itself.
dast = true
# P5 (founder decision 2026-10-15): a Bug story's proving tests rerun on the base commit; one that passes there
# fails the gate from this date, four weeks after the decision. Before it, the red-on-base check is advisory.
red_on_base_blocking_from = "2026-11-13"
# WP4.5b (founder decision 2026-10-16): feature-map drift is a warning in the merge gate until this date, four weeks
# after the decision, and fails the gate from it.
drift_blocking_from = "2026-11-13"
# Decision #480 (accepted 2026-10-17): the new floors and defaults report a miss as advisory until this date, four
# weeks after the decision, and fail from it.
new_floors_blocking_from = "2026-11-14"

[verify.floors.coverage]
min_diff_percent = 90.0

[verify.floors.sast]
max_critical = 0
max_high = 0

[verify.floors.secrets]
max_findings = 0

[verify.floors.deps]
max_critical = 0
max_high = 0

[verify.floors.a11y]
standard = "WCAG 2.2 AA"
max_critical = 0
max_serious = 0
keyboard_only = true
reduced_motion = true
text_scale_percent = 200
min_target_px = 44

[verify.floors.screen_reader]
layers = ["L01"]
max_missing_phrases = 0

[verify.floors.dast]
max_high = 0
skipped_blocks_ship = true

[verify.floors.mobile]
skipped_blocks_ship = true

# Autonomy: when an agent may merge without a human pass.
[autonomy]
streak = 20
never = ["L04", "L07", "L09"]
approver = ""
correction_days = 14
# Merge on proof (Decision #593): off unless a repository turns it on. A PR touching the narrow set below, or a workflow
# that holds a credential (a secret, the workflow token, an environment, or a write permission), always needs a person
# per PR. Every rung counts by default, the same-family C too (@rahulnakmol, 2026-10-18: "proof_rungs = ["A", "B", "C"]
# this should be default").
proof = false
proof_rungs = ["A", "B", "C"]
always_person = [".github/CODEOWNERS", ".aayudha/config.json", ".aayudha/config.local.toml", ".aayudha/config.local.json", "loops/build-ready.toml"]
always_person_config = [".aayudha/config.toml"]
always_person_sections = ["identity", "approvals", "autonomy", "seats", "verify", "inspect", "review", "models", "branches", "decisions", "proof", "delegate", "notify", "integrations", "telemetry", "mcp", "hosts", "lfs", "measure", "budget", "scope", "build", "baselines"]

# A build's budget. cost_usd applies only when aayu's own model calls are pay-as-you-go (a [models.gateway] endpoint or a
# direct provider's key is configured, or a host reports spend in AAYU_COST_USD); otherwise there is no cost limit,
# since subscription use reports no cost.
[autonomy.budget]
wall_hours = 8
cost_usd = 60.0
attempts = 3

# The build-ready loop (loops/build-ready.toml, `aayu build --next`): how many items it has in progress at once, from
# claim to merge. Its open pull requests count as well as its claims that have no pull request yet; 0 stops its picks.
[build]
in_flight = 1

# A Feature's baselines (`aayu ready <f> --part <p> --request`): each change in a new version says what changed, why it
# matters, and the need behind it, each in at least why_min_words words; a draft of version_warn or later warns.
# early_build_budget is the budget of one early build a person approves before the Feature's Approve to build
# (`aayu ready <f> --early-build <story>`), in multiples of [autonomy.budget] cost_usd.
[baselines]
why_min_words = 5
version_warn = 4
early_build_budget = 1

# Approve to build (`aayu ready <feature>`) opens when every seat's review of the Feature's baselines is in, or
# review_wait_hours after the reviews were asked for.
[critique]
review_wait_hours = 24

# Spend limits enforced by the model gateway's circuit breaker (WP1.6).
[budget]
per_story_usd = 60.0 # at least autonomy.budget.cost_usd, so the breaker never stops a story before its build budget
per_day_usd = 100.0
per_pr_inspect_max = 5.0
ci_minutes_month = 2000

# Proof media and retention (V3, WP4.2; run artifacts since S-4.2b).
[proof]
media = ""
retention_days = 90

# Release scope (aayu scope): the change budget after a person accepts a release's baseline, and the effort weights
# drift is measured in. Over budget, a change needs a person and an accepted Decision.
[scope]
budget_percent = 20.0
effort_points = [1, 2, 3, 5, 8] # XS, S, M, L, XL

# Founder minutes per merged PR (aayu:founder_minutes_per_pr, Story #989): sessions of human actions in the actions log.
[outcomes]
session_gap_minutes = 10 # a longer gap between two human actions starts a new session
action_minutes = 2       # each session adds this for its last action

# Design review tolerances and baseline paths (WP6.5, WP6.6).
[review]
figma_diff_max = 2.0 # percent of pixels after the anti-aliasing mask
baseline = ["/"]     # paths baseline captures per commit

# Settings WP1.2 onward read that CONSTRAINTS.md does not render.

# How inspect reviews a PR (WP4.8b): one reviewer (general) or two of different families (peer), and its noise filters.
[inspect]
mode = "general"
delegated_mode = "general" # PRs another agent built through build --delegate (WP5.5b; D-4.8b.7)
min_confidence = 0.5    # P2 and P3 findings below it are not posted
suppress_after = 2      # distinct human dismissals a finding must resemble to be suppressed
peer_model = ""         # empty: the first registry review candidate of another family
generated = ["LAYERS.md", "CONSTRAINTS.md", "docs/RACI.md", "internal/config/schema.json", "internal/mcp/schemas/*.json", "go.sum", "pnpm-lock.yaml"]
# The merge gate's one review tool (founder, 2026-10-18: no auto). The default, ci: the merge gate calls the model the
# repository's code-review environment names (variables AAYU_REVIEW_MODEL_URL and AAYU_REVIEW_MODEL, secret
# AAYU_REVIEW_MODEL_KEY; `aayu init --gates` creates it, docs/guide/how-review.md), and fails closed, naming what is
# missing, until it is set. Or an installed app (codex, coderabbit, greptile, claude, cursor), or human; `aayu install`
# asks. When the tool cannot review (a usage-limit or quota reply, or no reply within 30 minutes), the next installed app
# in that order reviews, then ci, then a person.
reviewer = "ci"
apps = []                 # codex, coderabbit, greptile, claude, cursor: what `aayu doctor` and `aayu install` detect
# Rung B (founder, 2026-10-18): the model ID the CI review calls when the code-review environment's AAYU_REVIEW_MODEL
# names none, and the fallback when no installed app can review the head. Capped by [budget] per_pr_inspect_max,
# asked for fast (priority) serving, and labelled (B, paid). The code-review environment's key is the one AI key in a
# product repository's CI, and only base branches reach it.
paid_reviewer = ""
paid_effort = ""          # a review's reasoning effort: low, medium, high, xhigh; empty: high (medium for Opus, Fable, Astra)

[inspect.app_families]
claude = "anthropic"
codex = "openai"

# How build --delegate reaches other agents (WP5.5b). Values name secrets; they never hold them.
[delegate]
cursor_secret = "cursor-api-key"
cursor_api = "https://api.cursor.com"
cursor_model = ""         # empty: Cursor's default model
codex_env = ""            # the Codex cloud environment ID; empty: Codex runs only with --local
amp_orb_size = "a1.small"
claude_trigger = "@claude"
checks = []               # empty: the brief points at the checks AGENTS.md lists
local_timeout_minutes = 60

# What the agent hosts include on the user's plan (Decision #469). Cursor's plans from 12 October 2026 ("x") include
# only Cursor's own models, so its lanes default to Grok and Composer; "legacy" (Pro, Pro+, Ultra before that date)
# keeps Claude and Gemini. aayu cannot tell them apart, and "x" never spends list-price money by surprise. The plan is
# the person's: set it in the user config or AAYU_HOSTS__CURSOR__PLAN; a checkout's config cannot.
[hosts.cursor]
plan = "x"

# Design tokens and OpenFeature flag definitions the design verbs check against (WP6.5).
[design]
tokens = "packages/design-system/tokens/tokens.json"
flags = "flags.flagd.json"

# GitHub LFS storage (V6: GitHub LFS only in 0.1).
[lfs]
quota_warn_percent = 80 # doctor warns at 80 % of the LFS quota (WP1.7)

# Decision SLAs, in business hours of [time] (V8, WP5.6).
[decisions]
sla_hours = 24
provisional_after_hours = 48
# Solo mode (at most one human): the window is the shorter of this and provisional_after_hours (Story #432). At least
# 12, and read only from .aayudha/config.toml, a protected path. Never a waiver, seat change, or human-only step.
solo_provisional_after_hours = 24

# Approving agents' human-only steps (Decision #488): a recorded approver's `/aayu approve` reply on a batch, or
# GitHub's device code. One-way doors always need the device code.
[approvals]
approvers = []
device_for = ["one-way"]

# Business hours for SLA clocks and paging windows (WP1.2). DST-aware through the IANA zone.
[time]
tz = "Europe/London"
business_hours = "Mon-Fri 09:00-18:00"
