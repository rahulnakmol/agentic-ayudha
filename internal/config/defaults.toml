# Default configuration embedded in the aayudha binary (docs/BUILD-PLAN.md WP0.5).
#
# This is the base configuration layer. WP1.2 layers the user, repository, local, environment, and flag
# layers on top of it. CONSTRAINTS.md is generated from this file by `go generate ./...`: change a value
# here, regenerate, and commit both. The generator (internal/config/gen) holds the meaning and plan source
# of every key it renders and fails when a key is added or removed without updating it.

# Floors run by `verify` (rule 7: no model disposition can override a floor miss).
[verify]
dast = false # ZAP baseline runs only when a product opts in (WP4.6)
# P5 (founder decision 2026-10-15): a Bug story's proving tests rerun on the base commit; one that passes there
# fails the gate from this date, four weeks after the decision. Before it, the red-on-base check is advisory.
red_on_base_blocking_from = "2026-11-13"
# WP4.5b (founder decision 2026-10-16): feature-map drift is a warning in the merge gate until this date, four weeks
# after the decision, and fails the gate from it.
drift_blocking_from = "2026-11-13"

[verify.floors.coverage]
min_diff_percent = 90.0

[verify.floors.sast]
max_critical = 0
max_high = 0

[verify.floors.secrets]
max_findings = 0

[verify.floors.deps]
max_critical = 0
max_high = 0

[verify.floors.a11y]
standard = "WCAG 2.2 AA"
max_critical = 0
max_serious = 0
keyboard_only = true
reduced_motion = true
text_scale_percent = 200
min_target_px = 44

[verify.floors.screen_reader]
layers = ["L01"]
max_missing_phrases = 0

[verify.floors.dast]
max_high = 0

[verify.floors.mobile]
skipped_blocks_ship = true

# Autonomy: when an agent may merge without a human pass.
[autonomy]
streak = 20
never = ["L04", "L07", "L09"]
approver = ""
correction_days = 14

[autonomy.budget]
wall_hours = 8
cost_usd = 25.0
attempts = 3

# Spend limits enforced by the model gateway's circuit breaker (WP1.6).
[budget]
per_story_usd = 25.0
per_day_usd = 100.0
per_pr_inspect_max = 5.0
ci_minutes_month = 2000

# Proof media and retention (V3, WP4.2; run artifacts since S-4.2b).
[proof]
media = ""
retention_days = 90

# Design review tolerances and baseline paths (WP6.5, WP6.6).
[review]
figma_diff_max = 2.0 # percent of pixels after the anti-aliasing mask
baseline = ["/"]     # paths baseline captures per commit

# Settings WP1.2 onward read that CONSTRAINTS.md does not render.

# How inspect reviews a PR (WP4.8b): one reviewer (general) or two of different families (peer), and its noise filters.
[inspect]
mode = "general"
delegated_mode = "general" # PRs another agent built through build --delegate (WP5.5b; D-4.8b.7)
min_confidence = 0.5    # P2 and P3 findings below it are not posted
suppress_after = 2      # distinct human dismissals a finding must resemble to be suppressed
peer_model = ""         # empty: the first registry review candidate of another family
generated = ["LAYERS.md", "CONSTRAINTS.md", "docs/RACI.md", "internal/config/schema.json", "internal/mcp/schemas/*.json", "go.sum", "pnpm-lock.yaml"]
# The merge gate holds no AI key: it @-mentions an agent app installed on the org or account and reads its reply
# (founder decision 2026-10-15). auto: the first of apps whose family differs from the builder's, else a human.
reviewer = "auto"
apps = []                 # claude, codex, cursor: what `aayu doctor` and `aayu install` detect, confirmed here

[inspect.app_families]
claude = "anthropic"
codex = "openai"

# How build --delegate reaches other agents (WP5.5b). Values name secrets; they never hold them.
[delegate]
cursor_secret = "cursor-api-key"
cursor_api = "https://api.cursor.com"
cursor_model = ""         # empty: Cursor's default model
codex_env = ""            # the Codex cloud environment ID; empty: Codex runs only with --local
amp_orb_size = "a1.small"
claude_trigger = "@claude"
checks = []               # empty: the brief points at the checks AGENTS.md lists
local_timeout_minutes = 60

# Design tokens and OpenFeature flag definitions the design verbs check against (WP6.5).
[design]
tokens = "packages/design-system/tokens/tokens.json"
flags = "flags.flagd.json"

# GitHub LFS storage (V6: GitHub LFS only in 0.1).
[lfs]
quota_warn_percent = 80 # doctor warns at 80 % of the LFS quota (WP1.7)

# Decision SLAs, in business hours of [time] (V8, WP5.6).
[decisions]
sla_hours = 24
provisional_after_hours = 48
# Solo mode (at most one human): the window is the shorter of this and provisional_after_hours (Story #432). At least
# 12, and read only from .aayudha/config.toml, a protected path. Never a waiver, seat change, or human-only step.
solo_provisional_after_hours = 24

# Business hours for SLA clocks and paging windows (WP1.2). DST-aware through the IANA zone.
[time]
tz = "Europe/London"
business_hours = "Mon-Fri 09:00-18:00"
