<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery preferences</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5f6f8; color: #1b2330; font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 560px; margin: 48px auto; background: #ffffff; border: 1px solid #dde1e7; border-radius: 12px; padding: 32px; }
  h1 { font-size: 24px; line-height: 32px; font-weight: 600; margin: 0 0 8px; }
  p { color: #4f5a6b; margin: 0 0 24px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  select { width: 100%; height: 44px; padding: 0 12px; border: 1px solid #7d8696; border-radius: 8px; background: #ffffff; color: #1b2330; font: inherit; }
  .actions { display: flex; gap: 12px; align-items: center; margin-top: 24px; }
  button { height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: #1f5bd1; color: #ffffff; font: inherit; font-weight: 600; cursor: pointer; }
  button.icon { width: 44px; padding: 0; background: #eaeef3; color: #1b2330; }
  button:focus-visible, select:focus-visible { outline: 2px solid #1f5bd1; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>Delivery preferences</h1>
  <p>Choose when we deliver your orders. If nobody is home, we keep the parcel at the depot for five days.</p>
  <label for="window">Delivery window</label>
  <select id="window">
    <option>Weekdays, 9:00 to 17:00</option>
    <option>Weekday evenings, 17:00 to 21:00</option>
    <option>Saturdays, 9:00 to 13:00</option>
  </select>
  <div class="actions">
    <button type="button">Save preferences</button>
    <button type="button" class="icon" aria-label="Help with delivery windows">?</button>
  </div>
</main>
</body>
</html>
