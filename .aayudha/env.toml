# The agent environment of this repository, discovered from the code by `aayu install --env`.
# Facts carry their evidence; [answers] records what the interview settled. Every host's
# environment (.agents/setup and the files that call it) is generated from this file:
# change it, then run `aayu install --env --apply`.
version = 1
hosts = ['amp', 'cursor', 'codex', 'claude']
packages = ['age', 'git-lfs', 'poppler-utils']
service = []
env = []
notes = ['apt package age (.github/workflows/aayudha-token.yml)', 'apt package poppler-utils (.github/workflows/evals.yml)', 'apt package git-lfs (.github/workflows/installers.yml)']

[[tool]]
name = 'go'
want = '>=1.25.0'
version = '1.27.2'
via = 'tarball'
evidence = 'go.mod:3 (go 1.25.0)'

[tool.sha256]
amd64 = 'ecbadb99091a3f46e31f5f934b068b1864eafa7995211b39eaddf76996045fe5'
arm64 = '94f3e30b8e374bc285e7dadc11e0865726b9bc6e85b841ccceaabc0214c6b7c8'

[[tool]]
name = 'node'
want = '^22.12.0 || ^24.0.0 || >=26.0.0'
version = '22.23.3'
accept = ['22.12.0 23.0.0', '24.0.0 25.0.0', '26.0.0']
via = 'tarball'
evidence = 'package.json engines.node (^22.12.0 || ^24.0.0 || >=26.0.0)'

[tool.sha256]
amd64 = 'df450af89261115ef9f9e3830c3eeb2cc9213b63c720b1af623cb5dcbe2e02de'
arm64 = 'a44aeb94849a299b22df10b9e622ec2f605c2183501bc40590705131de7c740f'

[[tool]]
name = 'pnpm'
want = '12.0.0'
version = '12.0.0'
via = 'corepack'
evidence = 'package.json packageManager (pnpm@12.0.0)'

[[tool]]
name = 'aayu'
want = 'source'
via = 'source'
evidence = 'go.mod module github.com/rahulnakmol/agentic-ayudha (cmd/aayudha)'

[[tool]]
name = 'corepack'
want = '>=0.36.0'
version = '0.36.0'
via = 'npm'
evidence = "pnpm and yarn come through corepack; a current corepack has the registry's current signing keys"

[[deps]]
run = 'go mod download'
evidence = 'go.sum'

[[deps]]
run = 'pnpm install --frozen-lockfile'
evidence = 'package.json packageManager (pnpm@12.0.0)'

[[browsers]]
run = 'pnpm --filter @aayudha/design-system exec playwright install --with-deps chromium'
evidence = 'packages/design-system/package.json depends on playwright'

[[checks]]
run = 'go build ./...'
evidence = 'go.mod'

[[checks]]
run = 'go test ./...'
evidence = 'go.mod'

[[checks]]
run = 'pnpm -r --if-present run test'
evidence = 'scripts.test in packages/design-system'

[[steps]]
run = "if ! version_ge \"$(git version | cut -d' ' -f3)\" 2.40; then need_apt build-essential libcurl4-gnutls-dev libexpat1-dev libssl-dev zlib1g-dev; t=$(mktemp -d); curl -fsSL https://mirrors.edge.kernel.org/pub/software/scm/git/git-2.55.0.tar.xz -o \"$t/git.tar.xz\"; echo \"457fdb04dc8728e007d4688695e6912e6f680727920f2a40bf11eacc17505357  $t/git.tar.xz\" | sha256sum -c --quiet -; tar -xJf \"$t/git.tar.xz\" -C \"$t\"; make -s -C \"$t/git-2.55.0\" -j\"$(nproc)\" prefix=/usr/local NO_RUST=1 NO_TCLTK=1 NO_GETTEXT=1 all > /dev/null; as_root make -s -C \"$t/git-2.55.0\" prefix=/usr/local NO_RUST=1 NO_TCLTK=1 NO_GETTEXT=1 install > /dev/null; rm -rf \"$t\"; hash -r; fi"
evidence = 'answer steps (human)'

[[gate]]
job = 'changes'
workflow = '.github/workflows/ci.yml'
remote = 'it picks the jobs a pull request needs from the paths it changes; the local gate runs every job'

[[gate]]
job = 'build'
workflow = '.github/workflows/ci.yml'
run = ['go build ./... && go vet ./... && go test -coverprofile="$GATE_TMP/coverage.out" ./...', 'go run ./internal/ratchet/cmd/ratchet -coverprofile "$GATE_TMP/coverage.out" -base "$(git merge-base origin/dev HEAD)"', 'go run ./internal/evals/cmd/eval -evolve-gate -base "$(git merge-base origin/dev HEAD)" -head HEAD -branch "$(git branch --show-current)"', 'CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o "$GATE_TMP/aayudha" ./cmd/aayudha && size=$(wc -c < "$GATE_TMP/aayudha") && echo "host binary: $size bytes (budget 60000000)" && [ "$size" -le 60000000 ]']
remote = 'the binaries for the other five platforms are built and measured against the 60 MB budget only in CI'

[[gate]]
job = 'generate-drift'
workflow = '.github/workflows/ci.yml'
run = ["d=\"$GATE_TMP/drift\"; GIT_LFS_SKIP_SMUDGE=1 git worktree add --quiet --detach \"$d\" HEAD; trap 'git worktree remove --force \"$d\"' EXIT; cd \"$d\"; go generate ./...; drift=$(git status --porcelain --untracked-files=all); if [ -n \"$drift\" ]; then echo \"generated files in the pushed commit are out of date: run go generate ./... and commit the result; do not edit generated files by hand\"; echo \"$drift\"; exit 1; fi; go generate ./...; if [ -n \"$(git status --porcelain --untracked-files=all)\" ]; then echo \"a second go generate run changed files; generators must be deterministic\"; exit 1; fi"]

[[gate]]
job = 'lint'
workflow = '.github/workflows/ci.yml'
run = ['go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0 run ./...']

[[gate]]
job = 'commits'
workflow = '.github/workflows/ci.yml'
run = ["cc='^(feat|fix|docs|refactor|test|build|ci|chore|perf|revert)(\\([a-z0-9][a-z0-9._/-]*\\))?!?: [^ ].*'; fail=0; for sha in $(git rev-list --no-merges \"$(git merge-base origin/dev HEAD)..HEAD\"); do subject=$(git log -1 --format=%s \"$sha\"); email=$(git log -1 --format=%ae \"$sha\"); if ! grep -qE \"$cc\" <<<\"$subject\"; then echo \"$sha: subject is not a Conventional Commit: $subject\"; fail=1; fi; if ! git log -1 --format=%B \"$sha\" | grep -iE '^Signed-off-by: .+ <[^>]+>$' | grep -qiF \"<$email>\"; then echo \"$sha: no DCO Signed-off-by trailer for the author <$email>: use git commit -s; fix with git rebase --signoff origin/dev\"; fail=1; fi; done; exit \"$fail\""]
remote = 'the pull request title (the squash subject) is checked only in CI'

[[gate]]
job = 'security'
workflow = '.github/workflows/ci.yml'
run = ['if have gitleaks; then gitleaks git . --redact --no-banner --log-opts=HEAD; fi', 'if have semgrep; then semgrep scan --config p/golang --config p/secrets --config p/github-actions --error --metrics=off; fi', 'if have osv-scanner; then osv-scanner scan source -r .; fi', 'if have gitleaks && have semgrep && have osv-scanner; then AAYU_FLOOR_TOOLS=1 go test ./internal/verify -run TestFloorsWithRealTools -count=1; fi', 'go run github.com/google/go-licenses/v2@v2.0.1 check ./... --allowed_licenses=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT', "allowed=0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,ISC,MIT; pnpm install --frozen-lockfile --ignore-scripts --silent; found=$(pnpm licenses list --recursive --prod --json | jq -r 'keys[]'); bad=$(grep -vxF -f <(tr ',' '\\n' <<<\"$allowed\") <<<\"$found\" || true); if [ -n \"$bad\" ]; then echo \"npm licences not on the allow list: $bad\"; exit 1; fi"]

[[gate]]
job = 'docs'
workflow = '.github/workflows/ci.yml'
run = ['npx --yes markdownlint-cli2@0.23.2 "**/*.md" "#.aayudha/worktrees/**"', "if have lychee; then lychee --no-progress --max-retries 3 --include-fragments './**/*.md'; fi"]

[[gate]]
job = 'release-snapshot'
workflow = '.github/workflows/ci.yml'
run = ['if have goreleaser; then goreleaser check; fi']
remote = 'the signed snapshot build needs the workflow OIDC token for keyless cosign signing, and the install.sh tests run against that snapshot'

[[gate]]
job = 'protected-paths'
workflow = '.github/workflows/protected-paths.yml'
remote = 'it reads the pull request CODEOWNER reviews from GitHub: a protected path needs an approval or the founder recorded bypass'

[answers]
[answers.browsers]
value = 'yes'
source = 'default'

[answers.hosts]
value = 'amp,cursor,codex,claude'
source = 'default'

