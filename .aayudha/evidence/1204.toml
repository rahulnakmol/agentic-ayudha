# Which tests prove Bug #1204's Completion Goal.

[[criterion]]
id = 1 # a PR from the branch at the head that closed before the merged PR opened: proof land counts the merged PR's own gate run
tests = ["internal/cli:TestProofLand"]

[[criterion]]
id = 2 # a PR from the branch at the head that opened after the merged PR merged: proof land lands the pack from its own run
tests = ["internal/cli:TestProofLand"]

[[criterion]]
id = 3 # a PR from the branch at the head that was open with the merged PR: proof land says aayudha/merge-gate is missing
tests = ["internal/cli:TestProofLand"]
