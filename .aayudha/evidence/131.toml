# Which tests prove story #131's Completion Goal (WP4.3: verify maps the go test -json events of these tests, from
# the run it makes, to the criteria).

[[criterion]]
id = 1 # the dental question is answered from the dental-deductible passage, quoted with its plan and section, and grounded
tests = ["examples/benefits-qa/answer:TestAnswerCitesPassage"]

[[criterion]]
id = 2 # questions about another person's records or asking for advice are refused before retrieval, with a reason and a message
tests = ["examples/benefits-qa/policy:TestScreenRefuses"]

[[criterion]]
id = 3 # a question the plan documents do not answer is referred to HR and quotes nothing
tests = ["examples/benefits-qa/answer:TestGroundRefers", "examples/benefits-qa/policy:TestGroundThreshold"]
