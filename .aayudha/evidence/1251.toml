# Which tests prove Bug #1251's Completion Goal.

[[criterion]]
id = 1 # a story added after Approve to build: ready names spec v<k+1>, --part spec --request --changes <file>, and aayu inbox, and no --ack
tests = ["internal/cli:TestReadyStoryCoverage"]

[[criterion]]
id = 2 # a covered story changed after Approve to build: the same steps with the changes listed, and no --ack
tests = ["internal/cli:TestReadyStoryCoverage"]

[[criterion]]
id = 3 # each command named in a string of internal/cli/ready*.go or internal/ready has a real verb, and each flag to the end of its sentence is that verb's; a joined suffix is checked against the command before it; controls show each wrong form fails
tests = ["internal/cli:TestReadyNamesOnlyRealCommands"]
