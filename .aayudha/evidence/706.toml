# Which tests prove story #706's Completion Goal (WP4.3: verify maps the go test -json events of these tests, from
# the run it makes, to the criteria).

[[criterion]]
id = 1 # 120x34: the grouped list on the left, the card with full title, why, counsel, and choices on the right
tests = ["internal/cli:TestInboxTUI", "internal/cli:TestInboxAlignment"]

[[criterion]]
id = 2 # narrow: the list first, a rule, then the card, with its choices and what the selected one does
tests = ["internal/cli:TestInboxTUI", "internal/cli:TestInboxAlignment"]

[[criterion]]
id = 3 # every line the terminal's width; the divider and every column at the same display cell on every row
tests = ["internal/cli:TestInboxAlignment"]

[[criterion]]
id = 4 # x on a needs-you item selects nothing and says why; X, Enter, and C act on housekeeping only
tests = ["internal/cli:TestInboxSelectsOnlyHousekeeping", "internal/cli:TestInboxTUI"]

[[criterion]]
id = 5 # live during a write: the checklist, the stage, and a second Enter queued
tests = ["internal/cli:TestInboxAcrossWrites"]

[[criterion]]
id = 6 # done across sessions with who and when, until a later read lists it again
tests = ["internal/cli:TestInboxAcrossWrites", "internal/cli:TestInboxRelisted"]

[[criterion]]
id = 7 # Tab and Shift-Tab cycle the items that need you
tests = ["internal/cli:TestInboxAcrossWrites"]
