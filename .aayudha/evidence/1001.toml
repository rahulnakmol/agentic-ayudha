# Which tests prove Story #1001's Completion Goal.

[[criterion]]
id = 1 # MS1's last story merges: the gate judges the dev tip's required checks (not protected-paths), verify --check all, and the evals of code-architect and engineering-manager; no model is called
tests = ["internal/cli:TestGateRunsChecksVerifyAndEvals"]

[[criterion]]
id = 2 # the gate passes: plan.json marks MS1 {state: passed, dev_sha}, and show no longer holds MS2's PRs behind MS1
tests = ["internal/cli:TestGatePassMarksMilestone"]

[[criterion]]
id = 3 # verify:inbox.ship-once fails: one fix starts with a brief that says Refs #889 and files no issue; the fix PR is in MS1, and MS1's gate runs again when it merges
tests = ["internal/cli:TestGateFailOpensOneFixPRPerCheck"]

[[criterion]]
id = 4 # fix PR #981: one gate_fixes entry {pr, milestone, check, dev_sha, approval {record, sha256}, at}; no issue and no triage record
tests = ["internal/cli:TestGateFixesEntryShape"]

[[criterion]]
id = 5 # two failed checks: two fixes, two fix PRs, each with its own gate_fixes entry
tests = ["internal/cli:TestGateFailOpensOneFixPRPerCheck"]

[[criterion]]
id = 6 # #981 spent $14, $40 left, #982 at $64: show counts the $14; #982 waits; one card offers "Raise the budget to $720, with a reason" and "Keep #982 waiting"
tests = ["internal/cli:TestGateFixCountsAgainstBudget"]

[[criterion]]
id = 7 # MS1's gate failed: mission next still starts MS2's stories (the open fix PR takes one slot), and show holds MS2's PRs behind MS1's gate
tests = ["internal/cli:TestFailedGateDoesNotHoldStarts"]

[[criterion]]
id = 8 # the third failed gate: the mission stops; one card lists each run with its check and time, gives no recommendation, and offers once more and stop
tests = ["internal/cli:TestGateStopsAtMaxNoGo"]

[[criterion]]
id = 9 # a cancelled check, or a 5xx in its log, reruns once with its reason recorded; a second failure fails the gate
tests = ["internal/cli:TestGateRerunsRunnerErrorOnce"]
