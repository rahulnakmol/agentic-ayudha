# Which tests prove Bug #799's Completion Goal.

[[criterion]]
id = 1 # solo mode, a Ready card whose PR comes to conflict with dev, then Enter: no bypass comment is posted
tests = ["internal/cli:TestInboxShipsReadyPRs"]

[[criterion]]
id = 2 # a bypass for an earlier head: ship --solo-bypass refuses and asks for one for the current head
tests = ["internal/cli:TestShipMobileWaiverAndSoloBypass"]

[[criterion]]
id = 3 # a bypass for the current head: it merges, and the ship record cites that comment and head
tests = ["internal/cli:TestShipMobileWaiverAndSoloBypass", "internal/cli:TestInboxShipsReadyPRs"]
