# aayudha configuration for rahulnakmol/agentic-ayudha, written by `aayu init` (WP2.5). It layers on the defaults built into
# the binary; `aayu config show --origin` shows where each value comes from. Protected path: changes need a
# human CODEOWNER review.
version = 1

[proof]
media = "" # optional private bucket. Proof media stay in the merge gate's run artifact without one; design and UI baseline media need one here, since a public repository never puts media in Git LFS (V3).

# aayudha has no paging channel yet: pages go to a JSON-lines outbox, which the Actions loops keep as an artifact (WP7.1).
[notify]
channel = "file"

# The nine-layer example product examples/benefits-qa (WP8.1) is the only app in this repository, so the web floors
# (WP4.5) capture it: `[verify] seed` builds it and starts it on seeded, synthetic data (V3), detached, on the local
# target; a story without screenshot or recording criteria never runs them. Budgets are the example's own.
[verify]
seed = ["examples/benefits-qa/deploy/serve.sh"]
# The feature maps' maintain pass (D-4.5b.8): a headless Amp run on the founder's side (`amp -x`, loops/README.md)
# follows the brief; Amp has no @-mention.
maintainer = "amp"

[verify.environments.local]
url = "http://127.0.0.1:8787"

[verify.floors.perf]
min_score = 0.9
max_lcp_ms = 2500
max_cls = 0.1
max_tbt_ms = 200

# Snapshot metrics of the example's Goal and Initiative (WP7.2), from its synthetic Application Insights exports.
[measure]
acquisition = "benefits_visit"
activation = "answer_grounded"
activation_days = 7

# CodeRabbit (rung A whatever the builder's family) stays installed as the fallback app (founder, 2026-10-18, after Codex
# reached its usage limits on #617). The CI review below supersedes "no AI key in the merge gate" (2026-10-15): the
# inspect job holds the code-review environment's key, which only the base branches reach.
[inspect]
# The CI review (founder, 2026-10-18: "Let's dog food this"): the merge gate calls the model the code-review environment
# names (AAYU_REVIEW_MODEL_URL, AAYU_REVIEW_MODEL, secret AAYU_REVIEW_MODEL_KEY; docs/guide/how-review.md).
reviewer = "ci"
apps = ["coderabbit"]      # installed; reviews only when the CI review cannot
paid_reviewer = "grok-4.7" # when the environment names no model
paid_effort = "high"

# Merge on proof into dev (Decision #593, option 1, accepted 2026-10-18). Rung C stays accepted, and recorded, until
# rung B is live in the merge gate (founder, 2026-10-18). The narrow set always needs a person per PR, because a
# change merged into dev reaches main with no human step: who may approve or bypass, the gate's own code, and releases.
# A workflow that holds a credential (a secret, the token, an environment, a write permission) is in it too, by rule.
[autonomy]
# The person who approves when autonomy does not apply (founder, 2026-10-18, on Codex's P2 on #634: "do it"): the only
# account whose review is inspect's human review, ship's human pass, plan --approve, and a Decision's authority for an
# unpaired seat. Its review is still a comment, which an agent with this account's token could write (#634's P2).
approver = "rahulnakmol"
proof = true
proof_rungs = ["A", "B", "C"]
always_person = [
  ".github/CODEOWNERS",
  "internal/cli/ship.go",
  "internal/cli/shippass.go",
  "internal/cli/shipproof.go",
  "internal/cli/presence.go",
  "internal/identity/",
  "internal/autonomy/",
  "internal/config/",
  ".github/workflows/aayudha-merge-gate.yml",
  ".github/workflows/protected-paths*.yml",
  ".github/workflows/release.yml",
  ".github/workflows/aayudha-approve.yml",
  ".github/workflows/aayudha-token.yml",
  ".goreleaser.yaml",
  "install.sh",
  ".aayudha/config.json",
  ".aayudha/config.local.toml",
  ".aayudha/config.local.json",
]
always_person_config = [".aayudha/config.toml", "internal/config/defaults.toml"]
