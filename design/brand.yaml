# Brand written by `aayu grill brand` (WP5.3). Every pair is checked against WCAG 2.2 AA.
version: 1
name: aayudha docs
voice:
  tone:
    - warm
    - direct
    - encouraging
    - plain
  avoid:
    - revolutionary
    - game-changing
    - seamless
    - seamlessly
    - world-class
    - best-in-class
    - cutting-edge
    - blazing
    - effortless
    - effortlessly
    - magical
    - guaranteed
    - synergy
    - exclamation marks
    - jargon without an explanation the first time it appears
    - internal plan references (work package numbers, Appendix B rows) outside the reference pages
