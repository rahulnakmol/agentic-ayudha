name: ux-review-live

# Live acceptance of `review` (docs/BUILD-PLAN.md WP6.6). Lane A is the ui-review lane's model through the AI
# gateway: the planted-defect and clean fixtures, each reviewed k = 3 times, and the planted page again after
# `polish`, where the build lane's model applies the critique in place of the host. Lane B runs the real tools:
# impeccable, axe, and the Playwright probes, pinned in packages/floors and pnpm-lock.yaml. The `ai-gateway`
# environment is restricted to dev, rolling, and main, so this never runs on pull requests or forks. Dispatch only,
# because every run costs model spend: nine ui-review calls with two screenshots each, plus one build-lane call.
# Skips cleanly (green) while the environment's secret is not set.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-review-live
  cancel-in-progress: false

jobs:
  live:
    name: ux-review-live
    runs-on: ubuntu-latest
    environment: ai-gateway
    timeout-minutes: 30
    env:
      AAYU_LIVE: "1"
      AAYU_FLOOR_WEB: "1"
      AAYU_AI_GATEWAY_URL: ${{ vars.AAYU_AI_GATEWAY_URL }}
      AAYU_SECRET_AI_GATEWAY: ${{ secrets.AAYU_SECRET_AI_GATEWAY }}
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install the review tools (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @aayudha/floors
      - name: Install Chromium
        run: pnpm --filter @aayudha/floors exec playwright install --with-deps chromium
      - name: Live review, lane A and lane B (skips while the secret is absent)
        run: |
          set -euo pipefail
          if [ -z "$AAYU_SECRET_AI_GATEWAY" ] || [ -z "$AAYU_AI_GATEWAY_URL" ]; then
            echo "::notice::The ai-gateway environment has no secret or URL; skipping the live review."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/review-live"
          AAYU_REVIEW_OUT="$RUNNER_TEMP/review-live" go test ./internal/uireview -run 'TestReviewLive' -count=1 -v -timeout 28m
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ux-review-live-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/review-live/review-live.json
            ${{ runner.temp }}/review-live/captures/*.png
          if-no-files-found: ignore
          retention-days: 30
