name: protected-paths-review

# Signal only: a review was submitted or dismissed. protected-paths-rerun.yml (which runs from the default
# branch) re-runs the protected-paths check for the PR's head commit so an approval can turn it green.
# This workflow runs from the PR's merge ref, so it must stay trivial: no token, no checkout, no PR data.
on:
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

jobs:
  signal:
    # Only a review the gate can count: internal/identity passes a path only on a human CODEOWNER's approval of the
    # head commit, keeps each reviewer's latest approval, change request, or dismissal, and ignores bots, the PR
    # author, and COMMENTED reviews. Any other review skips this job (no runner), and protected-paths-rerun.yml acts
    # only on a successful signal. Expression string comparisons ignore case, as the gate's login comparison does.
    if: >-
      github.event.review.user.type != 'Bot' && !endsWith(github.event.review.user.login, '[bot]') &&
      github.event.review.user.login != github.event.pull_request.user.login &&
      github.event.review.state != 'commented'
    runs-on: ubuntu-latest
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - run: echo "Review recorded; protected-paths-rerun re-evaluates the gate from the default branch."
