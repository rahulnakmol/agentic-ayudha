name: screen-reader

# The screen-reader floor of `aayu verify` (docs/BUILD-PLAN.md WP4.7) with real screen readers: VoiceOver on a
# macOS runner and NVDA on a Windows runner, driven by Guidepup (pinned in packages/floors and pnpm-lock.yaml).
# Those runners cost several times a Linux one (R3), so this runs only when a PR carries the
# `aayudha:screen-reader` label, nightly, or on dispatch. Not a required check.
on:
  pull_request:
    branches: [dev]
    types: [labeled, synchronize, reopened]
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: screen-reader-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25.x"

jobs:
  screen-reader:
    name: screen-reader (${{ matrix.reader }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'aayudha:screen-reader')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            reader: voiceover
          - os: windows-2025
            reader: nvda
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Install the floor tools (frozen lockfile)
        run: pnpm install --frozen-lockfile --filter @aayudha/floors
      - name: Configure the OS for screen-reader automation
        run: pnpm --filter @aayudha/floors exec guidepup setup --ci
      - name: Install the screen-reader assets
        run: pnpm --filter @aayudha/floors exec guidepup install
      - name: Install Chromium
        run: pnpm --filter @aayudha/floors exec playwright install chromium
      - name: Screen-reader floor (unlabeled button fails, labelled passes)
        env:
          AAYU_FLOOR_SR: "1"
        run: go test ./internal/verify -run TestScreenReaderFloorReal -count=1 -v -timeout 25m
