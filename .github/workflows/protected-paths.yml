name: protected-paths

# Solo-mode gate (docs/BUILD-PLAN.md WP0.1, Appendix B D2). Fails when a PR changes a path listed in the base
# branch's .github/CODEOWNERS. The protected-paths-codeowner-review ruleset requires this check and lets only the
# repository admin bypass it, through a pull request, so every protected-path merge is an explicit bypass that
# GitHub records in the rule-suite history. WP5.1 replaces this with native CODEOWNER review once a second
# human exists.
#
# pull_request_target runs this file as it exists on the base branch, so a PR cannot weaken its own gate.
# It never checks out or executes PR code; it only reads the PR's file list and the base CODEOWNERS via the API.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  # The job name is a required status check in the protected-paths-codeowner-review ruleset; do not rename.
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    steps:
      - name: Fail when protected paths change
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/contents/.github/CODEOWNERS?ref=$BASE_SHA" --jq .content | base64 -d > codeowners
          # Patterns are root-anchored: "/dir/" protects a directory, "/file" protects one file.
          patterns=$(sed -e 's/#.*//' codeowners | awk 'NF { print $1 }')
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' | sort -u > changed
          hits=""
          while IFS= read -r path; do
            for p in $patterns; do
              p="${p#/}"
              case "$p" in
                */) [[ "$path" == "$p"* ]] && hits+="$path (/$p)"$'\n' ;;
                *)  [[ "$path" == "$p" ]] && hits+="$path (/$p)"$'\n' ;;
              esac
            done
          done < changed
          if [[ -n "$hits" ]]; then
            echo "::error::This PR changes protected paths and needs a human CODEOWNER review."
            echo "Solo mode: only the repository admin can merge it, through the recorded ruleset bypass (CONTRIBUTING.md)."
            printf '%s' "$hits"
            exit 1
          fi
          echo "No protected paths changed."
