name: protected-paths

# Protected-path gate (docs/BUILD-PLAN.md WP0.1, extended by WP1.4; Appendix B D2). A PR that changes a path
# listed in the base branch's .github/CODEOWNERS passes only when every such path has an approving review of
# the head commit from one of its CODEOWNERs who is a human (type != Bot, not in [identity] bot_logins) and
# not the PR author. That is the bot-authored PR flow; a PR the founder authors still fails and merges only
# through the recorded admin bypass of the protected-paths-codeowner-review ruleset (solo mode,
# CONTRIBUTING.md). WP5.1 replaces this with native CODEOWNER review once a second human exists.
#
# pull_request_target runs this file as it exists on the base branch, and the job checks out the base branch,
# so a PR can weaken neither the workflow nor the gate code (internal/identity). It never checks out or runs PR
# code; it reads the PR, its files, and its reviews through the API. A submitted or dismissed review re-runs
# this check through protected-paths-review.yml and protected-paths-rerun.yml.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  # The job name is a required status check in the protected-paths-codeowner-review ruleset; do not rename.
  protected-paths:
    name: protected-paths
    runs-on: ubuntu-latest
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      # pull_request_target checks out the base branch by default; never pass a PR ref here.
      - name: Check out the base branch (never the PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Fetch the PR, its files, and its reviews
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/gate"
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/gate/pr.json"
          gh api --paginate "repos/$REPO/pulls/$PR/files" > "$RUNNER_TEMP/gate/files.json"
          gh api --paginate "repos/$REPO/pulls/$PR/reviews" > "$RUNNER_TEMP/gate/reviews.json"
      - name: Decide
        run: |
          go run ./internal/identity/cmd/protected-paths-gate \
            -codeowners .github/CODEOWNERS -repo . \
            -pr "$RUNNER_TEMP/gate/pr.json" -files "$RUNNER_TEMP/gate/files.json" -reviews "$RUNNER_TEMP/gate/reviews.json" || {
            echo "::error::This PR changes protected paths without an approval of its head commit by a human CODEOWNER who is not the author."
            echo "Bot-authored PRs: the founder approves the head commit. Founder-authored PRs (solo mode): only the repository admin can merge them, through the recorded ruleset bypass (CONTRIBUTING.md)."
            exit 1
          }
