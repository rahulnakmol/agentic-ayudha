# aayudha merge gate (docs/BUILD-PLAN.md WP4.8). Installed into product repos by `aayu init --gates` as
# .github/workflows/aayudha-merge-gate.yml; the template is embedded in the aayudha binary.
#
# pull_request_target runs this file as it is on the base branch, so a PR cannot weaken its own gate. The PR's
# code is checked out and run only in the `gate` job, which holds no secrets (a read-only workflow token), and
# only inside `aayu verify`'s sandbox (scrubbed environment, no network for the test run). The one AI key is the
# code-review environment's (founder, 2026-10-18), and only the `inspect` job holds it: that job never runs PR code,
# and reads the diff through the API and the pack the gate produced.
#
#   gate     re-runs `verify` on the PR head and fails when a floor misses, the pack does not prove the head,
#            the story's Completion Goal drifted from its Ready snapshot, or a criterion has no evidence. It keeps
#            the pack (pack.json and every artifact, media included) as the aayudha-pack run artifact for
#            [proof] retention_days, at most the repository's artifact retention limit.
#   inspect  on every PR that is ready for review, story or not, reviews the PR head with the tool [inspect] reviewer
#            names. ci (the default): it calls the model the code-review environment names, of a family other than
#            the builder's. An app (installed on the org or account): it reads the app's reply in the stated format, or
#            Codex's own review of the exact head; `aayu inspect <pr>`, run by the builder or a person under their own
#            account (`aayu build` does it after each push), posts the request, since the apps answer people, never a
#            workflow token. aayu turns the review into the disposition, criterion verdicts (a story PR's), and a sealed
#            coverage manifest; a missing or malformed review, fix, rebuild, or an unreviewed file fails it. A PR that
#            changes only docs passes without a review.
#   reply    on a comment or review on the PR (issue_comment and pull_request_review), re-runs the failed jobs of
#            the head's pull_request_target run once its reviewer has replied, or once a person with write access
#            reopened a review stopped at the round cap (`/aayu review again`), so the inspect check on the head
#            carries the verdict. It runs no PR code, holds no secret, and re-runs nothing for other comments.
#   pack     checks the run's pack against the PR head and the Ready snapshot and keeps one PR comment with each
#            criterion's verdict, the floors, the pack's SHA-256, and a link to the artifact; it fails when the pack
#            does not verify or a floor does not hold. Only the workflow token: CI writes nothing to the ledger.
#            `aayu ship`, run by a human, checks that the artifact came from this workflow's run on the exact head
#            and lands pack.json (no media) on the ledger under the human's identity.
#
# Setup (docs/guide/how-review.md): in Settings → Environments → code-review (`aayu init --gates` creates it, its
# deployment branches limited to the base branches), set the variables AAYU_REVIEW_MODEL_URL (the model endpoint's base
# URL) and AAYU_REVIEW_MODEL (the model ID), and the secret AAYU_REVIEW_MODEL_KEY. Or install a reviewer app and name it
# in [inspect] reviewer and [inspect] apps (`aayu doctor` detects it). No bot App or bucket.
name: aayudha-merge-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # A reviewer's reply re-runs the head's inspect job (the reply job). Both run the default branch's copy of this
  # file for issue comments; a review event runs the PR's copy, which can only ask the base run to re-read replies.
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]

permissions:
  contents: read

concurrency:
  group: aayudha-merge-gate-${{ github.event_name == 'pull_request_target' && 'gate' || 'reply' }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

env:
  AAYU_VERSION: "dev"
  PR: ${{ github.event.pull_request.number || github.event.issue.number }}
  REPO: ${{ github.repository }}
  # aayu halt (WP5.7): the verbs read the halt variable from here; the workflow token cannot read it through the API.
  AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}

jobs:
  gate:
    name: aayudha/merge-gate
    if: github.event_name == 'pull_request_target' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read # verify reads the head's evals.yml results for criteria proved by eval cases (Bug #1157)
    outputs:
      story: ${{ steps.verify.outputs.story }}
      retention: ${{ steps.verify.outputs.retention }}
      artifact-url: ${{ steps.keep.outputs.artifact-url }}
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # linux_x64
      OSV_SCANNER_VERSION: "2.6.0"
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108 # linux_amd64
      SEMGREP_VERSION: "1.180.0"
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      # Checking out PR code under pull_request_target is what a base-branch gate must do to verify it. This job
      # holds no secrets and a read-only token, and the PR's code runs only inside aayu verify's sandbox: scrubbed
      # environment, no network, and its own PID namespace, so nothing it starts outlives the test run.
      # nosemgrep: yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
      - name: Check out the PR head (run only inside aayu verify's sandbox)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: head
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: |
          set -euo pipefail
          # dev is a branch: fetch this module (GOPRIVATE) from GitHub directly rather than a possibly stale proxy copy; its
          # dependencies still come through the module proxy, so a go.googlesource.com outage cannot fail the install. Go runs git in
          # its module cache, and each git fetch starts a detached `git maintenance run --auto` whose repack rewrites
          # .git/shallow while Go's next fetch reads it ("fatal: shallow file has changed since we read it"). No maintenance.
          if [ "$AAYU_VERSION" = dev ]; then
            export GOPRIVATE=github.com/rahulnakmol/agentic-ayudha
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=maintenance.auto GIT_CONFIG_VALUE_0=false
          fi
          go install "github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@$AAYU_VERSION"
      - name: Floor tools (pinned, SHA-256 checked)
        run: |
          set -euo pipefail
          curl -fsSLo "$RUNNER_TEMP/gitleaks.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          curl -fsSLo "$RUNNER_TEMP/bin/osv-scanner" "https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SCANNER_SHA256}  $RUNNER_TEMP/bin/osv-scanner" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/osv-scanner"
          pipx install "semgrep==${SEMGREP_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # Unprivileged user and network namespaces for the no-network sandbox (Ubuntu restricts them by default).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      # Web floors (WP4.5) for this repository's example product (examples/benefits-qa, WP8.1, Appendix B D-8.1b).
      # The template leaves these tools to each product; here they come from the base branch's packages/floors and
      # pnpm-lock.yaml (trusted, never the PR's lockfile), with install scripts denied by pnpm-workspace.yaml, and
      # verify resolves Playwright, axe-core, and Lighthouse through NODE_PATH. The PR's own app is started only by
      # `[verify] seed` inside verify's scrubbed environment.
      - name: Check out the base branch for the web floor tools (trusted; no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: floor-tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: floor-tools/package.json
      - name: Web floor tools (frozen lockfile) and Chromium
        working-directory: floor-tools
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @aayudha/floors
          pnpm --filter @aayudha/floors exec playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/packages/floors/node_modules" >> "$GITHUB_ENV"
      - name: Fetch modules for the offline test run
        working-directory: head
        run: if [ -f go.mod ]; then go mod download; fi
      - name: Verify the PR head
        id: verify
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          aayudha verify "$PR" --ci --repo "$REPO" --json > "$RUNNER_TEMP/verify.json"
          code=$?
          set -e
          echo "story=$(jq -s '.[0].story // 0' "$RUNNER_TEMP/verify.json")" >> "$GITHUB_OUTPUT"
          # [proof] retention_days, at most the repository's artifact retention limit (GITHUB_RETENTION_DAYS).
          echo "retention=$(jq -s '.[0].retention_days // 0' "$RUNNER_TEMP/verify.json")" >> "$GITHUB_OUTPUT"
          jq -s -r '.[0] | "### aayudha verify: story #\(.story // "none"), head \(.head[0:7])\n\n| Floor | Result | Value | Threshold | Tool |\n|---|---|---|---|---|\n" + ([.checks[]? | "| \(.floor) | \(.result) | \(.value) | \(.threshold) | \(.tool) \(.version) |"] | join("\n")) + "\n\n" + ([(.gate_problems // [])[] | "- merge gate: " + .] | join("\n"))' "$RUNNER_TEMP/verify.json" >> "$GITHUB_STEP_SUMMARY"
          jq -s -c '.' "$RUNNER_TEMP/verify.json"
          exit "$code"
      - name: Keep the pack
        id: keep
        if: always() && steps.verify.outputs.story != '0' && steps.verify.outputs.story != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-pack
          path: head/.aayudha/proof/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: ${{ steps.verify.outputs.retention }}

  inspect:
    name: aayudha/inspect
    needs: gate
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    # The code-review environment holds the review model's endpoint, ID, and key. Restrict its deployment branches to the
    # base branches and the default branch (aayu init --gates does). GitHub checks a pull_request_target run against the
    # default branch, so it must be listed; no PR branch reaches the key.
    environment: code-review
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - name: Check out the base branch (trusted configuration; no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: |
          set -euo pipefail
          # dev is a branch: fetch this module (GOPRIVATE) from GitHub directly rather than a possibly stale proxy copy; its
          # dependencies still come through the module proxy, so a go.googlesource.com outage cannot fail the install. Go runs git in
          # its module cache, and each git fetch starts a detached `git maintenance run --auto` whose repack rewrites
          # .git/shallow while Go's next fetch reads it ("fatal: shallow file has changed since we read it"). No maintenance.
          if [ "$AAYU_VERSION" = dev ]; then
            export GOPRIVATE=github.com/rahulnakmol/agentic-ayudha
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=maintenance.auto GIT_CONFIG_VALUE_0=false
          fi
          go install "github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@$AAYU_VERSION"
      # A story PR's pack; a PR that serves no story has none and is judged on its disposition and coverage.
      - if: needs.gate.outputs.story != '0' && needs.gate.outputs.story != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aayudha-pack
          path: .aayudha/proof/
      # [inspect] reviewer = "ci" (the default; docs/guide/how-review.md): this job calls the model the code-review
      # environment names, within [budget] per_pr_inspect_max, at fast serving, labelled (B, paid), and fails closed,
      # naming what is missing, until its two variables and its secret are set. With an app as the reviewer, the app's
      # reply on the PR is the review, and the CI review is its fallback. This job checks out the base branch and runs no
      # PR code; the diff reaches the model only as delimited untrusted data. Logs and comments name the model, never the
      # key or the endpoint's URL.
      - name: Inspect (call the review model, or read the reviewer app's reply)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYU_REVIEW_MODEL_URL: ${{ vars.AAYU_REVIEW_MODEL_URL }}
          AAYU_REVIEW_MODEL: ${{ vars.AAYU_REVIEW_MODEL }}
          AAYU_REVIEW_MODEL_API_STYLE: ${{ vars.AAYU_REVIEW_MODEL_API_STYLE }}
          AAYU_REVIEW_MODEL_KEY: ${{ secrets.AAYU_REVIEW_MODEL_KEY }}
        run: aayudha inspect "$PR" --ci --repo "$REPO"

  pack:
    name: aayudha/pack
    needs: gate
    if: always() && github.event_name == 'pull_request_target' && needs.gate.outputs.story != '0' && needs.gate.outputs.story != '' && needs.gate.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - name: Check out the base branch (trusted configuration; no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: |
          set -euo pipefail
          # dev is a branch: fetch this module (GOPRIVATE) from GitHub directly rather than a possibly stale proxy copy; its
          # dependencies still come through the module proxy, so a go.googlesource.com outage cannot fail the install. Go runs git in
          # its module cache, and each git fetch starts a detached `git maintenance run --auto` whose repack rewrites
          # .git/shallow while Go's next fetch reads it ("fatal: shallow file has changed since we read it"). No maintenance.
          if [ "$AAYU_VERSION" = dev ]; then
            export GOPRIVATE=github.com/rahulnakmol/agentic-ayudha
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=maintenance.auto GIT_CONFIG_VALUE_0=false
          fi
          go install "github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@$AAYU_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aayudha-pack
          path: .aayudha/proof/
      # The workflow token only: the comment is the PR's view of the pack, and nothing is written to the ledger.
      - name: Check the pack and keep the PR comment
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STORY: ${{ needs.gate.outputs.story }}
          AAYU_PACK_ARTIFACT_URL: ${{ needs.gate.outputs.artifact-url }}
          AAYU_PACK_RETENTION_DAYS: ${{ needs.gate.outputs.retention }}
        run: aayudha proof comment "$STORY" --ci --repo "$REPO"

  reply:
    name: aayudha/inspect-reply
    # Only on an open PR, and only for a comment or review that may be a reviewer's reply, or a person's
    # `/aayu review again`, which re-runs a review stopped at the round cap. The reopen starts the job only
    # for an owner, member, or collaborator, so an account without write access starts no run (Bug #800).
    # On a personal repository a collaborator has write access, so this is exact; in an organisation a
    # member may be read-only, so aayu still checks the author's permission before it re-runs anything.
    # contains, not startsWith: aayu trims the comment before it reads the command, so a leading space counts.
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.issue.state == 'open' &&
      (endsWith(github.event.comment.user.login, '[bot]') || contains(github.event.comment.body, 'aayudha-review') ||
      (contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      contains(github.event.comment.body, '/aayu review again')))) ||
      (github.event_name == 'pull_request_review' && github.event.pull_request.state == 'open')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - name: Check out the default branch (trusted configuration; no PR code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: |
          set -euo pipefail
          # dev is a branch: fetch this module (GOPRIVATE) from GitHub directly rather than a possibly stale proxy copy; its
          # dependencies still come through the module proxy, so a go.googlesource.com outage cannot fail the install. Go runs git in
          # its module cache, and each git fetch starts a detached `git maintenance run --auto` whose repack rewrites
          # .git/shallow while Go's next fetch reads it ("fatal: shallow file has changed since we read it"). No maintenance.
          if [ "$AAYU_VERSION" = dev ]; then
            export GOPRIVATE=github.com/rahulnakmol/agentic-ayudha
            export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=maintenance.auto GIT_CONFIG_VALUE_0=false
          fi
          go install "github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@$AAYU_VERSION"
      - name: Re-run the head's inspect job when its reviewer replied
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: aayudha inspect "$PR" --ci --repo "$REPO"
