name: design-system

# packages/design-system (docs/BUILD-PLAN.md WP6.1–WP6.3): token exports up to date, typecheck, token parity and
# package policy, axe on every Storybook story, Storybook build. Kept out of ci.yml so the Go jobs and the
# required checks on dev are untouched; this check is path-filtered and not required.
on:
  push:
    branches: [dev, rolling, main]
    paths:
      - "packages/design-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/design-system.yml"
  pull_request:
    branches: [dev, rolling, main]
    paths:
      - "packages/design-system/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/design-system.yml"

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  design-system:
    name: design-system
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/design-system
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); a human clears it with aayu resume." && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
      - name: Token exports up to date
        run: pnpm tokens:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Token parity and package policy
        run: pnpm test
      - name: Install Chromium for Storybook tests
        run: pnpm exec playwright install --with-deps chromium
      - name: axe on every story
        run: pnpm test:storybook
      - name: Build Storybook
        run: pnpm build-storybook
