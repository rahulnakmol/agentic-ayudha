# Code generated from loops/*.toml by aayudha (WP7.1); DO NOT EDIT.
# aayudha loops, Actions fallback (docs/BUILD-PLAN.md WP7.1). Installed into product repos by `aayu init --gates`
# when loops/*.toml exists. Protected path.
#
# Each loop's cron is written in [time] tz (Europe/London); GitHub's cron is UTC, so a loop has one cron per UTC offset
# of the zone, and `aayudha hook loop:<name>` runs only the one for today's offset (github.event.schedule). The guard also
# stops on `aayu halt` (exit 4, before any write) and when this workflow's runs this month reach [budget]
# ci_minutes_month or the [budget] breaker has paused agent lanes (exit 6). Pages from [notify] channel "file" are kept
# as a run artifact.
name: aayudha-loops

on:
  schedule:
    - cron: "15 8,12,16 * * 1-5" # decisions: Mon–Fri at 09:15, 13:15, 17:15 Europe/London, while the zone is UTC+1
    - cron: "15 9,13,17 * * 1-5" # decisions: Mon–Fri at 09:15, 13:15, 17:15 Europe/London, while the zone is UTC+0
    - cron: "5 8 * * 1-5" # digest: Mon–Fri at 09:05 Europe/London, while the zone is UTC+1
    - cron: "5 9 * * 1-5" # digest: Mon–Fri at 09:05 Europe/London, while the zone is UTC+0
    - cron: "0 9 2 * *" # evolve: Day 2 of every month at 10:00 Europe/London, while the zone is UTC+1
    - cron: "0 10 2 * *" # evolve: Day 2 of every month at 10:00 Europe/London, while the zone is UTC+0
    - cron: "0 9 * * 1" # retro: Mon at 10:00 Europe/London, while the zone is UTC+1
    - cron: "0 10 * * 1" # retro: Mon at 10:00 Europe/London, while the zone is UTC+0
    - cron: "0 8 * * 1" # verify-maintain: Mon at 09:00 Europe/London, while the zone is UTC+1
    - cron: "0 9 * * 1" # verify-maintain: Mon at 09:00 Europe/London, while the zone is UTC+0
    - cron: "30 1 * * *" # verify-sweep: Daily at 02:30 Europe/London, while the zone is UTC+1
    - cron: "30 2 * * *" # verify-sweep: Daily at 02:30 Europe/London, while the zone is UTC+0
  workflow_dispatch:
    inputs:
      loop:
        description: Loop to run now (skips the schedule check)
        required: true
        type: choice
        options:
          - decisions
          - digest
          - evolve
          - retro
          - verify-maintain
          - verify-sweep

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read

concurrency:
  group: aayudha-loops-${{ github.event.schedule || inputs.loop }}
  cancel-in-progress: false

jobs:
  decisions:
    name: aayudha/loop-decisions
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'decisions') || github.event.schedule == '15 8,12,16 * * 1-5' || github.event.schedule == '15 9,13,17 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint the bot token
        id: app
        if: vars.AAYUDHA_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AAYUDHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AAYUDHA_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: write
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:decisions --ci --repo "$REPO"
      - name: Run aayu decide
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYU_BOT_TOKEN: ${{ steps.app.outputs.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$AAYU_BOT_TOKEN" ]]; then
            echo "::notice::No bot App (AAYUDHA_APP_CLIENT_ID): decisions writes as the bot, and the workflow token is never a bot identity (D1). Run aayu init --identity to create the App."
            exit 0
          fi
          aayudha decide --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-decisions
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30

  digest:
    name: aayudha/loop-digest
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'digest') || github.event.schedule == '5 8 * * 1-5' || github.event.schedule == '5 9 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:digest --ci --repo "$REPO"
      - name: Run aayu status --digest
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: aayudha status --digest --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-digest
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30

  evolve:
    name: aayudha/loop-evolve
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'evolve') || github.event.schedule == '0 9 2 * *' || github.event.schedule == '0 10 2 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:evolve --ci --repo "$REPO"
      - name: Run aayu evolve
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: aayudha evolve --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-evolve
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30

  retro:
    name: aayudha/loop-retro
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'retro') || github.event.schedule == '0 9 * * 1' || github.event.schedule == '0 10 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:retro --ci --repo "$REPO"
      - name: Run aayu retro
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: aayudha retro --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-retro
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30

  verify-maintain:
    name: aayudha/loop-verify-maintain
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'verify-maintain') || github.event.schedule == '0 8 * * 1' || github.event.schedule == '0 9 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint the bot token
        id: app
        if: vars.AAYUDHA_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AAYUDHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AAYUDHA_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: write
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:verify-maintain --ci --repo "$REPO"
      - name: Run aayu verify --map --maintain always
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYU_BOT_TOKEN: ${{ steps.app.outputs.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$AAYU_BOT_TOKEN" ]]; then
            echo "::notice::No bot App (AAYUDHA_APP_CLIENT_ID): verify-maintain writes as the bot, and the workflow token is never a bot identity (D1). Run aayu init --identity to create the App."
            exit 0
          fi
          aayudha verify --map --maintain always --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-verify-maintain
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30

  verify-sweep:
    name: aayudha/loop-verify-sweep
    if: (github.event_name == 'workflow_dispatch' && inputs.loop == 'verify-sweep') || github.event.schedule == '30 1 * * *' || github.event.schedule == '30 2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Halt check (aayu halt, WP5.7)
        if: vars.AAYUDHA_HALT != ''
        shell: bash
        env:
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
        run: echo "::error::Halted by aayu halt ($AAYUDHA_HALT); the loop does not run. A human clears it with aayu resume." && exit 4
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Mint the bot token
        id: app
        if: vars.AAYUDHA_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AAYUDHA_APP_CLIENT_ID }}
          private-key: ${{ secrets.AAYUDHA_APP_PRIVATE_KEY }}
          permission-issues: write
          permission-contents: write
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.x"
          cache: false
      - name: Install aayudha dev
        run: go install github.com/rahulnakmol/agentic-ayudha/cmd/aayudha@dev
      - name: Guard (schedule, halt, budget)
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          REPO: ${{ github.repository }}
        run: aayudha hook loop:verify-sweep --ci --repo "$REPO"
      - if: steps.guard.outputs.due == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - if: steps.guard.outputs.due == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up for aayu verify --check all --maintain drift
        if: steps.guard.outputs.due == 'true'
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --filter @aayudha/floors
          pnpm --filter @aayudha/floors exec playwright install --with-deps chromium
          echo "NODE_PATH=$PWD/packages/floors/node_modules" >> "$GITHUB_ENV"
      - name: Run aayu verify --check all --maintain drift
        if: steps.guard.outputs.due == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AAYU_BOT_TOKEN: ${{ steps.app.outputs.token }}
          AAYUDHA_HALT: ${{ vars.AAYUDHA_HALT }}
          AAYU_AGENT: "1"
          REPO: ${{ github.repository }}
        run: |
          if [[ -z "$AAYU_BOT_TOKEN" ]]; then
            echo "::notice::No bot App (AAYUDHA_APP_CLIENT_ID): verify-sweep writes as the bot, and the workflow token is never a bot identity (D1). Run aayu init --identity to create the App."
            exit 0
          fi
          aayudha verify --check all --maintain drift --ci --repo "$REPO"
      - name: Keep the pages
        if: always() && hashFiles('.aayudha/state/notify-outbox.jsonl') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aayudha-notify-verify-sweep
          path: .aayudha/state/notify-outbox.jsonl
          retention-days: 30
