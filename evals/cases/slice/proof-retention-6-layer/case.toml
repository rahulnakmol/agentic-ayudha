# Recorded run of the slice skill (WP5.4) on a fixture Feature whose expected paths span L02, L03, L04, L06, L07, L09: the host model
# sliced it, `aayu slice --draft --create` checked and wrote the stories, and github/ serves them so each recorded
# `ready --check` sees what the run wrote.
skill = "slice"
description = "Slice a Feature over L02, L03, L04, L06, L07, L09 into XS-L stories that each pass Ready."
input = "input.txt"
artifacts = ["output/slice.json"]
schemas = [{ file = "output/slice.json", schema = "evals/schemas/slice.json" }]
ready = ["output/stories/41.json", "output/stories/42.json", "output/stories/43.json", "output/stories/44.json", "output/stories/45.json"]
calls = [
  ["slice", "40", "--draft", "{case}/output/slice.json", "--create"],
  ["ready", "41", "--check"],
  ["ready", "42", "--check"],
  ["ready", "43", "--check"],
  ["ready", "44", "--check"],
  ["ready", "45", "--check"],
]

[tier2]
rubric = "rubric.md"
draft = "slice"
issue = 40

# Restrictions the Feature does not state, each caught once by the judge in a skills run on dev (D-5.4e): runs
# 39005126929 (191cd26, "its only trigger is the schedule") and 39009127596 (ef41886, "reject retention values that are
# not whole numbers of days").
[[scope]]
pattern = '(?i)\b(?:only|sole)\s+trigger|\btrigger(?:ed|s)?\s+only\b|\bno other trigger'
why = "restricts the workflow's triggers, which the Feature does not"
allow = '''(?i)\b(?:not|never|isn't)\s+(?:\w+\s+){0,2}?(?:only|sole)\s+trigger''' # "not the only trigger" restricts nothing (Story #401, D-4.3t)
match = ['the only trigger is a nightly schedule', 'triggered only by a push']
negated = ['the schedule is not the only trigger']
near_miss = ['the workflow keeps its triggers']

[[scope]]
pattern = '(?i)\breject\w*\b[^\n]{0,80}\b(?:whole|integer|fraction\w*|non-?integer|decimal)\b|\bnot a whole number'
why = "adds a format validation for retention values, which the Feature does not ask for"
allow = '''(?i)\b(?:not|never|don't|doesn't|without)\s+(?:\w+\s+){0,2}?reject\w*''' # "do not reject decimals" adds no validation (Story #401, D-4.3t)
match = ['reject retention values that are not whole numbers']
negated = ['do not reject decimal retention values']
near_miss = ['reject a negative retention value']
