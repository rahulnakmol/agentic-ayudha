# SLO case (Decision #324): the Production Engineer twin defines the first SLO of the example product benefits-qa at
# the startup stage, from the real output of `aayu slo --telemetry` over an export that holds incident #1, so the
# measured error rate is not a baseline. output/slo.md is a recorded answer (tier 1); planted/slo.md proposes a 100 %
# objective, which leaves no budget and the floors must catch. Tier 2 has the slo skill write it again and the judge
# score it.
skill = "slo"
description = "Atlas defines the first SLO of benefits-qa from an export that holds an incident, at the startup stage."
input = "grounding.md"
artifacts = ["output/slo.md"]

[persona]
seat = "production-engineer"
stage = "startup"
practice = "slo-error-budgets"
draft = "output/slo.md"
planted = "planted/slo.md"
task = "benefits-qa has no SLOs yet. Define the first one from the grounding at this team stage, with the proposed ops/slos.toml in a toml block; the founder will review the pull request tomorrow."

[tier2]
rubric = "../rubric.md"
