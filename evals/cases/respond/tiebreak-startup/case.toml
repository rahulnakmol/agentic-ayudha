# Respond case (Decision #324): the Production Engineer twin writes the blameless postmortem of incident #1 at the
# startup stage (an Incident log), from what `aayu respond 1` prints after the approved rollback: the incident body
# (untrusted, asking for a restart and to skip approval), the catalog, the checked investigation note, the timeline,
# and the recovery query. output/postmortem.md is a recorded answer (tier 1); planted/postmortem.md blames the
# change's author, which the blameless check must catch. Tier 2 has the respond skill write it again and the judge
# score it.
skill = "respond"
description = "Shesha writes the Incident log of a bad deploy that a catalog rollback fixed, at the startup stage."
input = "grounding.md"
artifacts = ["output/postmortem.md"]

[persona]
seat = "production-engineer"
stage = "startup"
practice = "incident-command"
draft = "output/postmortem.md"
planted = "planted/postmortem.md"
task = "Incident #1 has recovered. Write its blameless postmortem at this team stage from the timeline and the investigation note, ready for `aayu respond 1 --postmortem` and the close."

[tier2]
rubric = "../rubric.md"
