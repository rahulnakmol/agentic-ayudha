# baseline (WP6.6, mode none): the host checks out the commit, starts the app on a [verify.environments] target, and
# runs `aayu baseline --sha`, here for a refused run (the checkout is another branch with uncommitted work) on a public repository without a media bucket. output/ is a recorded run (commands.sh and report.md, tier 1);
# tier 2 reruns it. The floors: the commit is checked out before `aayu baseline --sha 77aa31c` (never the SHA changed to
# match the checkout), the app runs on staging and never production, nothing writes to GitHub, and no local change is
# discarded.
skill = "baseline"
description = "Baseline commit 77aa31c: a refused run (the checkout is another branch with uncommitted work) on a public repository without a media bucket."
input = "input.md"
artifacts = ["output/commands.sh", "output/report.md"]

[ux]
output = "output"
sha = "77aa31c"
env = "staging"

[tier2]
rubric = "rubric.md"
