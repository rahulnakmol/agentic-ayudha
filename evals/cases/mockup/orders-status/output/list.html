<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your orders</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ay-color-background); color: var(--ay-color-text-default); font-family: var(--ay-font-family-sans); font-size: var(--ay-font-size-large); line-height: 1.5; }
  main { max-width: 760px; margin: var(--ay-space-page) auto; padding: 0 var(--ay-space-gap); }
  h1 { font-size: var(--ay-font-size-header-2); font-weight: var(--ay-font-weight-semibold); margin: 0 0 var(--ay-space-section); }
  .card { background: var(--ay-color-surface); border: 1px solid var(--ay-color-border); border-radius: var(--ay-radius-container); padding: var(--ay-space-section); }
  .primary { display: inline-flex; align-items: center; justify-content: center; min-height: var(--ay-size-control-height); padding: 0 var(--ay-space-control-inline); border: 0; border-radius: var(--ay-radius-control); background: var(--ay-color-brand-default); color: var(--ay-color-brand-contrast); font: inherit; font-weight: var(--ay-font-weight-semibold); text-decoration: none; cursor: pointer; }
  .primary:hover { background: var(--ay-color-brand-hover); }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--ay-color-focus); outline-offset: 2px; }
  @media (max-width: 480px) { .primary { width: 100%; } }
  table { width: 100%; border-collapse: collapse; }
  caption { text-align: left; color: var(--ay-color-text-label); font-size: var(--ay-font-size-body); padding-bottom: var(--ay-space-gap); }
  th { text-align: left; font-size: var(--ay-font-size-body); font-weight: var(--ay-font-weight-semibold); color: var(--ay-color-text-label); background: var(--ay-color-list-header); padding: 0 var(--ay-space-gap); height: var(--ay-size-row-height); }
  td { padding: 0 var(--ay-space-gap); height: var(--ay-size-row-height); border-top: 1px solid var(--ay-color-border); }
  td a { display: inline-flex; align-items: center; min-height: var(--ay-size-control-height); min-width: var(--ay-size-control-height); color: var(--ay-color-brand-default); font-weight: var(--ay-font-weight-semibold); }
  .status { display: inline-block; padding: 2px var(--ay-space-gap); border-radius: var(--ay-radius-control); font-size: var(--ay-font-size-body); font-weight: var(--ay-font-weight-semibold); }
  .status.out { background: var(--ay-color-informative-background); color: var(--ay-color-informative-default); }
  .status.packed { background: var(--ay-color-neutral-background); color: var(--ay-color-neutral-default); }
  .status.delivered { background: var(--ay-color-positive-background); color: var(--ay-color-positive-default); }
  @media (max-width: 480px) {
    thead { position: absolute; left: -9999px; }
    tr { display: grid; grid-template-columns: 1fr auto; align-items: center; padding: var(--ay-space-gap) 0; border-top: 1px solid var(--ay-color-border); }
    td:nth-child(even) { justify-self: end; }
    td { display: block; height: auto; border: 0; padding: 0; }
  }
</style>
</head>
<body>
<main>
  <h1>Your orders</h1>
  <div class="card">
    <table>
      <caption>Your orders, newest first</caption>
      <thead><tr><th scope="col">Order</th><th scope="col">Date</th><th scope="col">Total</th><th scope="col">Delivery status</th></tr></thead>
      <tbody>
        <tr><td><a href="/orders/10482">#10482</a></td><td>14 Oct</td><td>€42.10</td><td><span class="status out">Out for delivery</span></td></tr>
        <tr><td><a href="/orders/10477">#10477</a></td><td>11 Oct</td><td>€18.75</td><td><span class="status packed">Being packed</span></td></tr>
        <tr><td><a href="/orders/10431">#10431</a></td><td>2 Oct</td><td>€63.00</td><td><span class="status delivered">Delivered</span></td></tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
