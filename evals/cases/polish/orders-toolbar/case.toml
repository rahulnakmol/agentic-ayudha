# polish (WP6.6): the host applies a review critique to the orders list toolbar and rows. output/ is a recorded run (tier 1); tier 2 reruns
# it. The floors: the page is rewritten whole with token colours only and every control kept, polish.md reports every
# kind of finding, and lane B in Chromium (impeccable, axe, the focus and 44 px probes) finds no a11y finding on it
# (n/a in tier 1 without AAYU_FLOOR_WEB=1).
skill = "polish"
description = "Apply the critique to the orders list toolbar and rows."
input = "input.md"
artifacts = ["output/orders.html", "output/polish.md", "critique.json", "orders.html"]

[ux]
output = "output"
page = "orders.html"
planted = ["contrast", "labels", "target-size"]
context = ["./critique.json", "evals/cases/mockup/design-system.md", "packages/design-system/src/styles/tokens.css"]

[tier2]
rubric = "rubric.md"
