# Recorded run of the ready skill on issue #12, which a human wrote through the Story form.
skill = "ready"
description = "Validate a complete Story for Ready; the skill's only call is the read-only check."
input = "input.txt"
artifacts = ["output/issue.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"] # the work item the run validated, as the WP2.7 parser builds it
calls = [["ready", "12", "--check"]] # n/a until WP2.7; github/ serves issue #12 for it
