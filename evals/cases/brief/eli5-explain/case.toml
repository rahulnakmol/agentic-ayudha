# brief (WP7.3): the eli5 register with purpose explain, on Feature #7. The grounding is shared by the brief cases.
# output/brief.md is a recorded draft (tier 1); tier 2 has the skill write it again and the judge score it.
skill = "brief"
description = "A eli5 brief with purpose explain on Feature #7 (CSV export of filtered claims)."
input = "../grounding.json"
artifacts = ["output/brief.md"]
brief = { register = "eli5", purpose = "explain", draft = "output/brief.md" }

# Known defect classes caught once by the judge (run 38210971285), kept as deterministic guards (D-3.4c): a measure
# read as the behaviour behind it.
scope = [
  { pattern = '(?i)\b(shows?|means?|proves?)\s+(that\s+)?(people|reviewers?|users?)\s+(use|used|read|open|audit|like|want|need)\b', why = "a behaviour behind the count the Result does not measure" },
]

[tier2]
rubric = "rubric.md"

