# Decision-pack case (WP5.1b, D-5.1f): a stuck human asks whether to waive a floor; the topic routes it to the Quality
# Architect twin (Yama), who writes the pack at the enterprise stage, so the three decide cases cover the three team
# stages. Tier 2 has the decide skill write the pack again for the judge.
skill = "decide"
description = "Yama's decision pack: waive the coverage floor for #212 or hold PR #219 for tests."
input = "../grounding.md"
artifacts = ["output/pack.md"]

[pack]
seat = "quality-architect"
stage = "enterprise"
question = "Should the 90.0 changed-line coverage floor be waived for #212 so PR #219 can merge, or should PR #219 wait for tests that bring coverage over it?"
draft = "output/pack.md"

[tier2]
rubric = "../rubric.md"
