# Decision-pack case (WP5.1b, D-5.1l): a stuck human asks where the quarter's budget and engineer time go; the topic
# routes it to the Founder twin (Zeus), who weighs operations, technology, and product, names the perspective that
# dominates and why, and labels the door, at the scaleup stage. Its own grounding and rubric: a build, buy, or neither
# decision. Tier 2 has the decide skill write the pack again for the judge.
skill = "decide"
description = "Zeus's decision pack: build a rules engine, buy a hosted one, or hard-code the three rules clinics ask for most."
input = "../founder-grounding.md"
artifacts = ["output/pack.md"]

[pack]
seat = "founder"
stage = "scaleup"
question = "Should this quarter's budget and engineer time go on building our own rules engine, on a hosted rules engine, or on hard-coding only the three rules clinics ask for most, for follow-up booking?"
draft = "output/pack.md"

[tier2]
rubric = "../founder-rubric.md"
