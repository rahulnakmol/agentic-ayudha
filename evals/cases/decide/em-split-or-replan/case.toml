# Decision-pack case (WP5.1b, D-5.6b): a stuck human asks a delivery question about story #212; the topic routes it to
# the Engineering Manager twin (Nestor), who writes the pack at the startup stage. planted/pack.md is the same pack
# without its pre-mortem, which tier 1 must refuse. Tier 2 has the decide skill write the pack again for the judge.
skill = "decide"
description = "Nestor's decision pack: split #212 or re-plan it as an M."
input = "../grounding.md"
artifacts = ["output/pack.md", "planted/pack.md"]

[pack]
seat = "engineering-manager"
stage = "startup"
question = "Should #212 be split into an L04 purge story now and an L07 tombstone story next, or re-planned as one M story while PR #219 waits?"
draft = "output/pack.md"
incomplete = "planted/pack.md"

[tier2]
rubric = "../rubric.md"
