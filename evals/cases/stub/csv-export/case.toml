# The stub skill drafts a Ready Story from a request. output/ is a recorded run (tier 1); tier 2 reruns it.
skill = "stub"
description = "Draft a Ready Story for a CSV export request."
input = "input.txt"
artifacts = ["output/issue.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]

# Invented specifics: requirements the request does not state. A tier-2 run scored 2 for adding the first two (evals.yml run 38184730879);
# the case keeps them as deterministic guards, checked before the judge.
scope = [
  { pattern = '(?i)content[- ]?type|\btext/csv\b|\bmime\b', why = "a content type the request does not state" },
  { pattern = '(?i)\b(column|display(ed)?|list|same|screen)\s+order\b|\bordered\b|\bsorted\b', why = "an ordering the request does not state" },
  { pattern = '(?i)\butf-?8\b|\bbom\b|\bdelimiter\b|\bfile ?name\b', why = "a file format detail the request does not state" },
  { pattern = '(?i)\b\d+(\.\d+)?\s*(ms|milliseconds?|seconds?|s)\b', why = "a time limit the request does not state" },
  { pattern = '(?i)\b(at most|up to|no more than|maximum of|limited to)\s+[\d,]+', why = "a size limit the request does not state" },
]
# Conventions that come with the format the request names are not invented: a CSV has a header row naming its
# columns, so no rule may match "header row" (TestScopeConventionVersusInvented).

[tier2]
rubric = "rubric.md"
verb = "grill" # the stub drafts a Story as `grill story` does, so it runs on grill's lane (spec)
