# Recorded run of the grill skill (`grill incident`, WP5.3): the host model interviewed with references/incident.md, validated the
# draft, and wrote it with --create.
# Incident is intake: triage classifies it and `ready` refuses it by design, so the run ends at the Create-validated issue
# (Appendix B D-5.3a); the ready check below is the schema's Ready validation of the recorded item.
skill = "grill"
description = "Grill a Incident from a request; the issue it writes passes Ready validation (intake: never made Ready)."
input = "input.txt"
artifacts = ["output/issue.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "incident", "--title", "A third of claimants cannot sign in", "--body", "### Impact\n\nAbout a third of claimants get an error when they sign in; caseworkers are not affected.\n\n### Severity\n\nSev1\n\n### Started at\n\n2026-10-12 09:10 IST", "--create"],
]
