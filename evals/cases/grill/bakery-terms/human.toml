# The simulated human of grill/bakery-terms (WP5.8): the bakery's owner. The skill tags each question with a topic, <dimension>/<key>, the keys
# coming from the catalogues' Topics (jargon.md, vague/idea.md), term/<term> for an abbreviation, or the request topics in the skill. The human
# answers by topic, else by the topic's dimension, else with the fallback, which parks it: an unscripted idea never becomes a
# requirement. kind: confirm (states or agrees), default (accepts the skill's offered default), park, or defer.
max_rounds = 4
readback = "Yes, that is what done looks like."
