# Recorded grill conversation (WP5.8) on an abbreviation-heavy request: "The PDP needs a CTA for B2B catering orders, and keep PII
# out of the logs" in the synthetic bakery app (../testdata/bakery). The gate said unpack (four terms and no outcome); the skill
# confirmed each term's meaning with the scripted human (human.toml), then worked out the user, outcome, and smallest slice.
skill = "grill"
description = "Unpack an abbreviation-heavy request into confirmed terms and a concrete story; the conversation is scripted by human.toml."
input = "input.txt"
repo = "../testdata/bakery"
gate = "unpack"
transcript = "output/transcript.json"
cite = 2
artifacts = ["output/issue.json", "output/transcript.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "story", "--assess", "--idea", "The PDP needs a CTA for B2B catering orders, and keep PII out of the logs. It belongs under Feature #60 (Catering)."],
  ["grill", "story", "--idea", "The PDP needs a CTA for B2B catering orders, and keep PII out of the logs. It belongs under Feature #60 (Catering).", "--parent", "60", "--title", "Send a catering request from the menu", "--body", "### Summary\n\nAs an office manager ordering pastries for a meeting, I want an 'Order for your office' button on the menu that sends a catering request, so that my order arrives instead of getting lost on the phone.\n\n### Completion Goal\n\n1. [screenshot] state: `/menu` with the seeded menu; expected: one \"Order for your office\" button on the menu page\n2. [recording] state: `/menu` as the seeded office manager pressing \"Order for your office\"; expected: a form with 6 fields: company, name, email, phone, date, and how many people\n3. [api-trace] state: the seeded office manager sends the form with all 6 fields; expected: POST /api/orders creates 1 order that holds the company, name, email, phone, date, and number of people\n4. [metric] state: the app's log output while the seeded office manager sends the form; expected: 0 lines containing the seeded name, email, or phone number\n\n### Measure\n\ncatering requests received through the form per week\n\n### Threshold\n\nat least 5 a week\n\n### Scenario\n\nAs the seeded office manager, open /menu, press the button, fill in the form with the seeded company, name, email, phone, date, and 12 people, and send it; read the created order and the app's log output.\n\n### Environment\n\nlocal app with the seeded synthetic office manager; never production\n\n### Checkpoints\n\n1. The menu shows the one button, and it opens the six-field form (criteria 1, 2)\n2. Sending the form creates the order with the request's details (criterion 3)\n3. The logs hold none of the form's personal data (criterion 4)\n\n### Assumptions\n\n- Catering requests reuse POST /api/orders, as orders do today.\n- The seeded office manager and company are synthetic data.\n\n### Open questions\n\n- answered: which page PDP means (the menu, /menu)\n\n### Parked ideas\n\n- prices and invoices: pricing a catering order and invoicing the company (out of scope, said the human)\n\n### Provenance\n\nRequest: \"The PDP needs a CTA for B2B catering orders, and keep PII out of the logs. It belongs under Feature #60 (Catering).\"\nTerm: \"PDP\" → the menu, `/menu`, where each product has its tile; \"By PDP I mean the menu, /menu, where each product has its tile\"\nTerm: \"CTA\" → one call-to-action button that starts a catering order; \"Yes, a call to action: one button that starts a catering order\"\nTerm: \"B2B\" → offices that order trays of pastries for meetings; \"B2B means offices that order trays of pastries for meetings\"\nTerm: \"PII\" → customer names, emails, and phone numbers; \"PII is personal data: customer names, emails, and phone numbers\"\n1. confirmed (idea.slice/smallest-slice): \"Just an 'Order for your office' button on the menu page\"; facts: component:ProductTile\n2. confirmed (idea.slice/smallest-slice): \"a short form: company, name, email, phone, date, and how many people\"\n3. confirmed (idea.outcome/change): \"Every catering request should arrive as an order we can see\"; facts: route:/api/orders, event:order_submitted\n4. confirmed (request/scope): \"no customer name, email, or phone number may show up in any of our logs\" / \"customer names, emails, and phone numbers\"", "--labels", "effort:M", "--create"],
