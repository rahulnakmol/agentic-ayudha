# Recorded run of the grill skill (`grill experiment`, WP5.3): the host model interviewed with references/experiment.md, validated the
# draft, and wrote it with --create. github/ serves the created issue (#21) and its parent so the recorded `ready --check` sees
# what the run wrote.
skill = "grill"
description = "Grill a Experiment from a request; the issue it writes passes Ready."
input = "input.txt"
artifacts = ["output/issue.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "experiment", "--parent", "20", "--title", "First-claim checklist raises claim submissions", "--body", "### Hypothesis\n\nIf new claimants see the first-claim checklist, the share who submit a claim rises from 0.10 to 0.12.\n\n### Metric\n\nclaim_submitted\n\n### Baseline\n\n0.10 conversion to claim_submitted over the 28 days before 2026-10-12, from PostHog\n\n### Flag\n\nfirst-claim-checklist\n\n### Minimum sample\n\n3841 per arm; two-sided two-proportion z-test, alpha 0.05, power 0.8, baseline rate 0.10, detectable rate 0.12", "--labels", "priority:P2", "--create"],
  ["ready", "21", "--check"],
]
