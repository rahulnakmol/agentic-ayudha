# The simulated human of grill/bakery-motion (WP5.8): the bakery's owner. The skill tags each question with a topic, <dimension>/<key>, the keys
# coming from the catalogues' Topics (vague/motion.md, vague/ux.md), term/<term> for an abbreviation, or the request topics in the skill. The human
# answers by topic, else by the topic's dimension, else with the fallback, which parks it: an unscripted idea never becomes a
# requirement. kind: confirm (states or agrees), default (accepts the skill's offered default), park, or defer.
max_rounds = 4
readback = "Yes, that is what done looks like."
fallback = { kind = "park", text = "That is not part of what I asked for; park it." }

[topics."motion.purpose/moments"]
kind = "confirm"
text = "Two moments: moving between the order steps, and an item going into the basket. Nothing else needs to move."

[topics."motion.purpose/purpose"]
kind = "confirm"
text = "So customers can tell they moved forward or back a step, and see that the item went in."

