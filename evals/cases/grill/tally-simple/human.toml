# The simulated human of grill/tally-simple (WP5.8): tally's maintainer. The skill tags each question with a topic, <dimension>/<key>, the keys
# coming from the catalogues' Topics (vague/simplicity.md), term/<term> for an abbreviation, or the request topics in the skill. The human
# answers by topic, else by the topic's dimension, else with the fallback, which parks it: an unscripted idea never becomes a
# requirement. kind: confirm (states or agrees), default (accepts the skill's offered default), park, or defer.
max_rounds = 4
readback = "Yes, that is what done looks like."
fallback = { kind = "park", text = "That is not part of what I asked for; park it." }

[topics."simple.cli-first-run/first-command"]
kind = "confirm"
text = "The first thing people type is `tally add 12.50 lunch`, and it fails because they never ran `tally init`. It should just work: create what it needs on first use, in GBP like `tally init` does today."

