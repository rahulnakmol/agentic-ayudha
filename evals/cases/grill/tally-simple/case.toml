# Recorded grill conversation (WP5.8) on a vague request about a command-line tool: "Make the tally CLI simple to use" in the
# synthetic tally CLI (../testdata/tally). The assessment found a CLI product, so "simple" decomposed into first run, commands and
# flags, errors, and help; the scripted human (human.toml) answered by topic.
skill = "grill"
description = "Unpack \"make the CLI simple\" into command-line criteria; the conversation is scripted by human.toml."
input = "input.txt"
repo = "../testdata/tally"
gate = "unpack"
transcript = "output/transcript.json"
cite = 3
artifacts = ["output/issue.json", "output/transcript.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "story", "--assess", "--idea", "Make the tally CLI simple to use. New users get lost. It belongs under Feature #70 (Getting started)."],
  ["grill", "story", "--idea", "Make the tally CLI simple to use. New users get lost. It belongs under Feature #70 (Getting started).", "--parent", "70", "--title", "Log a first expense with one plain command", "--body", "### Summary\n\nAs someone who just installed tally, I want to log my first expense with one plain command, so that I do not get lost before I start.\n\n### Completion Goal\n\n1. [api-trace] state: a fresh home directory with no tally configuration or data, running `tally add 12.50 lunch`; expected: exit code 0, and `tally list` then shows 1 expense of 12.50 GBP in category lunch\n2. [api-trace] state: `tally add --help` in the seeded home directory; expected: 0 required flags, and the amount and the category accepted as the first two words\n3. [api-trace] state: running `tally add` with no arguments; expected: exit code 2 and a message naming the missing amount with the example `tally add 12.50 lunch`\n4. [api-trace] state: `tally --help` in an 80-column terminal; expected: at most 24 lines, including a usage line and the example `tally add 12.50 lunch`\n\n### Measure\n\nCompletion Goal criteria observed\n\n### Threshold\n\nall 4 criteria\n\n### Scenario\n\nIn a fresh home directory, run `tally add 12.50 lunch` and `tally list`; then `tally add --help`, `tally add` with no arguments, and `tally --help`, recording each command's output and exit code.\n\n### Environment\n\na fresh temporary home directory on linux with synthetic expenses only; never a real user's data\n\n### Checkpoints\n\n1. `tally add 12.50 lunch` works on a fresh machine without `tally init` (criterion 1)\n2. `tally add` takes the amount and category as words, with no required flag (criterion 2)\n3. A bare `tally add` says what to type, and `tally --help` fits one screen (criteria 3, 4)\n\n### Assumptions\n\n- The default currency is GBP, as `tally init` sets today.\n- Usage errors exit 2 and other failures exit 1 (the accepted default).\n\n### Open questions\n\n- answered: whether the first `tally add` needs `tally init` (no: it creates what it needs)\n\n### Parked ideas\n\n- fewer commands: dropping report and export (raised by grill; the human parked it)\n- remembered choices: remembering the last category (the human parked it)\n\n### Provenance\n\nRequest: \"Make the tally CLI simple to use. New users get lost. It belongs under Feature #70 (Getting started).\"\nVague: \"simple\" → criteria 1, 2, 3, 4\n1. confirmed (simple.cli-first-run/first-command): \"It should just work: create what it needs on first use, in GBP\"; facts: command:tally add, command:tally init\n2. confirmed (simple.cli-surface/command-count): \"`tally add` should take the amount and a category as plain words, with every flag optional\"; facts: command:tally add\n3. default (simple.cli-errors/exit-codes): \"Your default is fine.\" / \"it should say what to type instead\"; facts: code:cmd/tally/main.go\n4. confirmed (simple.cli-help/help-text): \"one screen, 24 lines is fine, with an example of add\"; facts: command:tally", "--labels", "effort:M", "--create"],
  ["ready", "71", "--check"],
]

# The human parked dropping commands and remembering choices: neither may become a criterion.
scope = [
  { pattern = '(?i)\b(remov|drop|delet)\w*\s+(the\s+)?(`?tally\s+)?(report|export)', why = "dropping report or export, which the human parked" },
  { pattern = '(?i)\bremember|last[- ]used|\brecent categor', why = "remembered choices, which the human parked" },
]

[tier2]
rubric = "rubric.md"
human = "human.toml"
references = ["story.md", "vague/simplicity.md"]
