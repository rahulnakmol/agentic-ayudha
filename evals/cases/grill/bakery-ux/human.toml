# The simulated human of grill/bakery-ux (WP5.3b): the bakery's owner. Each question is answered by the catalogue
# dimension the skill tags it with (skills/grill/references/vague/ux.md); any other topic gets the fallback, which parks it.
# kind: confirm (states or agrees), default (accepts the skill's offered default), park, or defer.
max_rounds = 4
readback = "Yes, that is what done looks like."
fallback = { kind = "park", text = "Not for this story; park it." }

[answers."ux.tasks"]
kind = "confirm"
text = "A customer picks bread, chooses a pickup time, and pays, and knows the order went through: they see an order number and the pickup time."

[answers."ux.steps"]
kind = "confirm"
text = "Five screens is too many. Three screens at most: choose items, then pickup time and details together, then review and pay."

[answers."ux.states"]
kind = "confirm"
text = "When a payment fails, keep the basket and show a message with a Try again button on the same screen. Loading is fine as it is, and offline can wait."

[answers."ux.platforms"]
kind = "default"
text = "Your default is fine."

[answers."ux.consistency"]
kind = "confirm"
text = "Only our existing tokens and components; nothing new-looking."

[answers."ux.content"]
kind = "defer"
text = "I'm not sure about the wording yet. Leave it open and I'll write it with the shop staff."

[answers."ux.trust"]
kind = "confirm"
text = "Show the total price and the pickup time on the review screen before they pay."

[answers."ux.performance"]
kind = "park"
text = "Speed is fine today; leave it."

[answers."ux.accessibility"]
kind = "park"
text = "The floors are enough for this one."
