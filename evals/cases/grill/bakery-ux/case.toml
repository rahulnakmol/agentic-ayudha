# Recorded grill conversation (WP5.3b) on a vague request: "high-quality UX for ordering" in the synthetic bakery app
# (../testdata/bakery). The skill assessed the repository (the first call), asked three rounds that the scripted human
# (human.toml) answered by topic, and wrote a story whose every criterion is observable, cites the facts it rests on,
# and records who stated or confirmed it. github/ serves Feature #40, the repository's stories, #14, and the created #41.
skill = "grill"
description = "Grill a vague UX request into a concrete, grounded story; the conversation is scripted by human.toml."
input = "input.txt"
repo = "../testdata/bakery"
transcript = "output/transcript.json"
cite = 3
artifacts = ["output/issue.json", "output/transcript.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "story", "--assess", "--idea", "The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering)."],
  ["grill", "story", "--idea", "The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering).", "--parent", "40", "--title", "Order bread for pickup in three screens", "--body", "### Summary\n\nAs a customer of the bakery, I want to order bread for pickup in three screens and know the order went through, so that ordering feels quick and trustworthy.\n\n### Completion Goal\n\n1. [recording] state: `/order` as the seeded customer with an empty basket; expected: choosing one loaf, a pickup time, and paying takes at most 3 screens, after which the order confirmation shows\n2. [screenshot] state: the order confirmation after the seeded customer pays; expected: a screen of its own with the order number and the chosen pickup time\n3. [screenshot] state: `/order/review` with the seeded basket of 2 items; expected: the total price and the pickup time are shown on the review screen before paying\n4. [recording] state: `/order/review` when the seeded customer pays with the seeded declining test card; expected: an error message and a \"Try again\" button appear on the same screen and the basket still holds its 2 items\n5. [screenshot] state: each of the 3 order screens at 390 px and 1280 px wide; expected: the screen shows without horizontal scrolling at both widths\n6. [metric] state: the changed files of the 3 order screens; expected: 0 colour, spacing, or font values outside the `--crumb-` tokens in `web/styles/tokens.css`, and 0 components besides the existing ones in `web/components`\n\n### Measure\n\nCompletion Goal criteria observed\n\n### Threshold\n\nall 6 criteria\n\n### Scenario\n\nAs the seeded customer, open /order with an empty basket, choose one loaf, choose a pickup time and enter details on the second screen, review and pay on the third, and see the confirmation; repeat with the seeded declining test card; capture each screen at 390 px and 1280 px.\n\n### Environment\n\nlocal app with the seeded synthetic customer and the payment stub; never production\n\n### Links\n\ndepends-on #14\n\n### Checkpoints\n\n1. The seeded customer orders a loaf in 3 screens and sees the confirmation screen with the order number and pickup time (criteria 1, 2)\n2. The review screen shows the total and the pickup time, and a declined test card keeps the basket with a Try again button (criteria 3, 4)\n3. Every order screen fits 390 px and 1280 px and uses only the existing tokens and components (criteria 5, 6)\n\n### Assumptions\n\n- Payment stays as it is today (lib/payments.ts); the seeded declining test card makes a payment fail.\n- The order confirmation is a new screen; its order number comes from POST /api/orders.\n- The pickup slots come from #14.\n\n### Open questions\n\n- answered: which task first (a first order for pickup, ending on a confirmation)\n- answered: where the confirmation goes (its own screen after paying, not one of the three)\n- deferred: the exact wording of the confirmation and the payment error message (the human writes it with the shop staff; the build uses placeholders they review)\n- deferred: offline handling (the human says it can wait)\n\n### Parked ideas\n\n- loyalty stamp card: every tenth loaf free, shown on the confirmation (raised by grill; the human parked it)\n\n### Provenance\n\nRequest: \"The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering).\"\nVague: \"high-quality UX\" → criteria 1, 2, 3, 4, 5, 6\n1. confirmed (ux.steps/screen-count): \"Three screens at most\"; facts: flow:/order\n2. confirmed (ux.steps/confirmation-placement): \"The confirmation is its own screen after paying\" / \"they see an order number and the pickup time\"; facts: route:/api/orders, event:order_submitted\n3. stated (ux.trust/before-paying): \"Show the total price and the pickup time on the review screen before they pay\"; facts: route:/order/review, component:BasketSummary\n4. confirmed (ux.states/payment-failure): \"keep the basket and show a message with a Try again button on the same screen\"; facts: gap:error:/order, event:payment_declined\n5. default (ux.platforms/widths): \"Your default is fine.\"; facts: floor:platforms\n6. confirmed (ux.consistency/tokens-and-components): \"Only our existing tokens and components\"; facts: tokens:web/styles/tokens.css, component:Button, component:Stepper", "--labels", "effort:L,priority:P2", "--create"],
  ["ready", "41", "--check"],
]

[tier2]
rubric = "rubric.md"
human = "human.toml"
references = ["story.md", "vague/ux.md"]

# The scripted human parked speed, accessibility beyond the floors, and the loyalty idea, and deferred the wording and
# offline: none of them may become a criterion. Checked in tier 1 and before the judge in tier 2.
[[scope]]
pattern = '(?i)\bloyalt|\bstamp'
why = "the loyalty stamp card the human parked"
# the human parked this topic: ruling it out still decides it, so the negated form fires too
match = ['a loyalty stamp card on the receipt', 'collect a stamp per order']
negated = ['no loyalty stamp card']
near_miss = ['the order shows a timestamp']
negated_fires = true

[[scope]]
pattern = '(?i)\[sr-transcript\]|screen[- ]?reader|\bkeyboard\b|\bwcag\b|\bcontrast\b|\baxe\b'
why = "accessibility beyond the floors, which the human parked"
# the human parked this topic: ruling it out still decides it, so the negated form fires too
match = ['1. [sr-transcript] state: the menu', 'reachable by keyboard']
negated = ['no screen-reader criterion']
near_miss = ['the screen reads "Order placed"']
negated_fires = true

[[scope]]
pattern = '(?i)\blighthouse\b|\b(lcp|cls|tbt)\b|\b\d+(\.\d+)?\s*(ms|milliseconds?|seconds?)\b'
why = "a performance budget the human parked"
# the human parked this topic: ruling it out still decides it, so the negated form fires too
match = ['the menu loads in 200 ms', 'a Lighthouse score of 90']
negated = ['the menu need not load in 200 ms']
near_miss = ['pickup in 15 minutes']
negated_fires = true

[[scope]]
pattern = '(?i)\boffline\b'
why = "an offline state the human deferred"
# the human parked this topic: ruling it out still decides it, so the negated form fires too
match = ['an offline banner when the network drops']
negated = ['no offline state']
near_miss = ['the online menu']
negated_fires = true

[[scope]]
pattern = '(?i)expected:[^\n]*(?:message|text|heading|title|label)\s+\"'
why = "exact wording the human deferred"
match = ['expected: a heading "Your order is in"']
negated = ['expected: a confirmation message, with no exact wording']
near_miss = ['expected: a "Place order" button']
