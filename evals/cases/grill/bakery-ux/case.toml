# Recorded grill conversation (WP5.3b) on a vague request: "high-quality UX for ordering" in the synthetic bakery app
# (../testdata/bakery). The skill assessed the repository (the first call), asked two rounds that the scripted human
# (human.toml) answered by dimension, and wrote a story whose every criterion is observable, cites the facts it rests on,
# and records who stated or confirmed it. github/ serves Feature #40, the repository's stories, and the created #41.
skill = "grill"
description = "Grill a vague UX request into a concrete, grounded story; the conversation is scripted by human.toml."
input = "input.txt"
repo = "../testdata/bakery"
transcript = "output/transcript.json"
cite = 3
artifacts = ["output/issue.json", "output/transcript.json"]
schemas = [{ file = "output/issue.json", schema = "evals/schemas/workitem.json" }]
ready = ["output/issue.json"]
calls = [
  ["grill", "story", "--assess", "--idea", "The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering)."],
  ["grill", "story", "--idea", "The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering).", "--parent", "40", "--title", "Order bread for pickup in three screens", "--body", "### Summary\n\nAs a customer of the bakery, I want to order bread for pickup in three screens and know the order went through, so that ordering feels quick and trustworthy.\n\n### Completion Goal\n\n1. [recording] state: `/order` as the seeded customer with an empty basket; expected: choosing one loaf, a pickup time, and paying reaches the order confirmation in at most 3 screens\n2. [screenshot] state: the order confirmation after the seeded customer pays; expected: the order number and the chosen pickup time are shown\n3. [screenshot] state: `/order/review` with the seeded basket of 2 items; expected: the total price and the pickup time are shown above the \"Pay now\" button\n4. [recording] state: `/order/review` when the seeded customer pays with the seeded declining test card; expected: an error message and a \"Try again\" button appear on the same screen and the basket still holds its 2 items\n5. [screenshot] state: each of the 3 order screens at 390 px and 1280 px wide; expected: the screen shows without horizontal scrolling at both widths\n6. [metric] state: the changed files of the 3 order screens; expected: 0 colour, spacing, or font values outside the `--crumb-` tokens in `web/styles/tokens.css`, and 0 components besides the existing ones in `web/components`\n\n### Measure\n\nCompletion Goal criteria observed\n\n### Threshold\n\nall 6 criteria\n\n### Scenario\n\nAs the seeded customer, open /order with an empty basket, choose one loaf, choose a pickup time and enter details on the second screen, review and pay on the third; repeat with the seeded declining test card; capture each screen at 390 px and 1280 px.\n\n### Environment\n\nlocal app with the seeded synthetic customer and the payment stub; never production\n\n### Assumptions\n\n- Payment stays as it is today (lib/payments.ts); the seeded declining test card makes a payment fail.\n- The order confirmation is a new screen; its order number comes from POST /api/orders.\n- Loading stays as it is today (web/app/order/loading.tsx); offline handling is out of scope.\n\n### Open questions\n\n- answered: which task first (a first order for pickup, ending on a confirmation)\n- deferred: the exact wording of the confirmation and the payment error message (the human writes it with the shop staff; the build uses placeholders they review)\n\n### Parked ideas\n\n- loyalty stamp card: every tenth loaf free, shown on the confirmation (raised by grill; the human parked it)\n\n### Provenance\n\nRequest: \"The bakery app needs high-quality UX for ordering. It belongs under Feature #40 (Online ordering).\"\nVague: \"high-quality UX\" → criteria 1, 2, 3, 4, 5, 6\n1. confirmed (ux.steps): \"Three screens at most\"; facts: flow:/order\n2. stated (ux.tasks): \"pays by card on the review screen as they do today\" / \"they see an order number and the pickup time\"; facts: route:/api/orders, event:order_submitted\n3. stated (ux.trust): \"Show the total price and the pickup time on the review screen before they pay\"; facts: route:/order/review, component:BasketSummary\n4. confirmed (ux.states): \"keep the basket and show a message with a Try again button on the same screen\"; facts: gap:error:/order\n5. default (ux.platforms): \"Your default is fine.\"; facts: floor:platforms\n6. confirmed (ux.consistency): \"Only our existing tokens and components\"; facts: tokens:web/styles/tokens.css, component:Button, component:Stepper", "--labels", "effort:M,priority:P2", "--create"],
  ["ready", "41", "--check"],
]

# The scripted human parked speed, accessibility beyond the floors, and the loyalty idea, and deferred the wording:
# none of them may become a criterion. Checked in tier 1 and before the judge in tier 2.
scope = [
  { pattern = '(?i)\bloyalt|\bstamp', why = "the loyalty stamp card the human parked" },
  { pattern = '(?i)\[sr-transcript\]|screen[- ]?reader|\bkeyboard\b|\bwcag\b|\bcontrast\b|\baxe\b', why = "accessibility beyond the floors, which the human parked" },
  { pattern = '(?i)\blighthouse\b|\b(lcp|cls|tbt)\b|\b\d+(\.\d+)?\s*(ms|milliseconds?|seconds?)\b', why = "a performance budget the human parked" },
  { pattern = '(?i)\boffline\b', why = "an offline state the human said can wait" },
  { pattern = '(?i)expected:[^\n]*(?:message|text|heading|title|label)\s+\"', why = "exact wording the human deferred" },
]

[tier2]
rubric = "rubric.md"
human = "human.toml"
references = ["story.md", "vague/ux.md"]
