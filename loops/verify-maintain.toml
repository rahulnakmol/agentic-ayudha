# Weekly maintain pass (WP4.5b.4): the brief goes to the agent app [verify] maintainer names every week, drift or not,
# so the app also looks for capabilities the map misses. No model key is used here. The cron is in [time] tz.
description = "Weekly maintain pass: hand the feature maps' maintain brief to the agent app [verify] maintainer names."
command = ["verify", "--map", "--maintain", "always"]
cron = "0 9 * * 1"
bot = true
prompt = "If [verify] maintainer is amp or unset, follow the maintain procedure of the verify skill on the brief aayu just posted: edit only the feature maps' skill directories and open at most one pull request. Otherwise report the brief's link."
