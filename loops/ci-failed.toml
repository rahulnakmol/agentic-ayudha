# Failed checks go back to the builder (P3, #231; Appendix B S-7.1c, S-7.1e). A scheduled sweep once each weekday morning
# (D-7.1f) replaces the check_suite event loop deferred from 0.2: for each story delegated to a cloud agent, the sync sends a
# failed required check back to the agent that built it, within the two-cycle cap. The cron is in [time] tz.
description = "Failed-check sweep: send each delegated story's failed required check back to its builder."
command = ["status", "--work"]
cron = "45 9 * * 1-5"
hosts = ["amp", "cursor", "claude", "codex"]
prompt = "For each story in the list that is delegated to a cloud agent and whose pull request has a failed required check (read it with `gh pr checks <pr> --required`), run `AAYU_AGENT=1 aayu build <story> --delegate <its receiver>` once to sync it, which sends the failed check back to the builder within the cap, and report what it did. If there is none, stop without reporting."
