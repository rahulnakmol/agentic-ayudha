# Founder digest (WP2.8, WP7.1). It runs in the person's morning window ([time] windows, 10:30-11:30 by default; Story
# #1254), not overnight: [notify] holds non-urgent pages until a window, and a scheduled run keeps no held pages. The
# cron is in [time] tz.
# `status --digest` is deterministic and reads with the workflow token, so the loop needs no agent: it runs in the
# free GitHub Actions fallback.
description = "Founder digest: the status rollup of every open Goal, paged through [notify]."
command = ["status", "--digest"]
cron = "35 10 * * 1-5"
agent = false
