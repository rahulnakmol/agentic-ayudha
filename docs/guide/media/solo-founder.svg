<!-- Hand-made for docs/guide/guide-solo-founder.md; edit by hand. Facts: internal/verbs/registry.go (person-only inputs and gates), internal/cli/inbox.go. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 748" width="460" height="748" role="img" aria-labelledby="solo-title solo-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="solo-title">Working alone, the twins do the work and you keep nine kinds of step, most of them gathered in one inbox</title>
<desc id="solo-desc">The twins fill every seat and do the work. You keep the steps only a person may take: answer the interview, accept Decisions, for a risky plan, comment a solo-mode bypass on the Story and record it, post a solo-mode bypass and ship, ask for a stable release, approve production actions, accept Feedback and review skill changes, publish, and halt or resume. aayu inbox gathers the waiting Decisions, pull requests at the review cap, and stale stories and Bugs into one list, one keypress each.</desc>
<defs><marker id="arrow-solo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5bd1"/></marker></defs>
<rect width="460" height="748" fill="#ffffff"/>
<rect x="12" y="12" width="436" height="64" rx="12" fill="#f3f0fa" stroke="#6941c6" stroke-width="2"/>
<text x="26" y="38" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start">Fourteen twins fill every seat</text>
<text x="26" y="60" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">They interview, plan, build, check, review, and report.</text>
<text x="14" y="102" font-size="15" fill="#9a6700" font-weight="bold" text-anchor="start">What you still do by hand</text>
<rect x="12" y="112" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="133" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Answer the interview, confirm done</text>
<text x="24" y="153" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">in your agent: grill</text>
<rect x="12" y="170" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="191" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Accept a Decision or a floor waiver</text>
<text x="24" y="211" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu decide &lt;n&gt; --accept &lt;option&gt;</text>
<rect x="384" y="178" width="54" height="20" rx="10" fill="#ffffff" stroke="#1f5bd1" stroke-width="1.2"/>
<text x="411" y="192" font-size="11.5" fill="#1f5bd1" font-weight="bold" text-anchor="middle">inbox</text>
<rect x="12" y="228" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="249" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Comment “Solo-mode bypass:” on the Story, then</text>
<text x="24" y="269" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu plan &lt;story&gt; --solo-bypass</text>
<rect x="12" y="286" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="307" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Post “Solo-mode bypass:”, then ship</text>
<text x="24" y="327" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu ship &lt;pr&gt; --solo-bypass</text>
<rect x="12" y="344" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="365" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Ask for a stable release</text>
<text x="24" y="385" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu release &lt;n&gt; --to main, at a terminal</text>
<rect x="12" y="402" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="423" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Approve a production action</text>
<text x="24" y="443" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">the GitHub Environment's approval</text>
<rect x="12" y="460" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="481" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Accept Feedback, review skill changes</text>
<text x="24" y="501" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">label it needs:grill; review evolve's PR</text>
<rect x="12" y="518" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="539" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Publish docs or launch copy</text>
<text x="24" y="559" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu tell &lt;kind&gt; --from &lt;draft&gt; --publish</text>
<rect x="12" y="576" width="436" height="52" rx="8" fill="#fdf6e3" stroke="#9a6700" stroke-width="1.2"/>
<text x="24" y="597" font-size="14" fill="#1d2330" font-weight="bold" text-anchor="start">Stop or restart everything</text>
<text x="24" y="617" font-size="12" fill="#535b6b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu halt, aayu resume</text>
<rect x="12" y="640" width="436" height="96" rx="12" fill="#eef3fd" stroke="#1f5bd1" stroke-width="2"/>
<text x="26" y="666" font-size="15" fill="#1d2330" font-weight="bold" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aayu inbox</text>
<text x="26" y="688" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Decisions, pull requests at the review cap,</text>
<text x="26" y="706" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">stories merged without a ship record, fixed</text>
<text x="26" y="724" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Bugs, replaced stories: one keypress each</text>
</svg>
