<!-- Hand-made for docs/guide/growth.md; an illustrative scenario, not a customer. Facts: internal/config/config.go (TeamStage), seats/*/persona.toml (artefacts by stage), internal/seats/seat.go (pairing). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 930" width="460" height="930" role="img" aria-labelledby="growth-title growth-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="growth-title">An illustrative path from a two-founder MVP to a widely used product: the people and the ceremony grow, the floors do not</title>
<desc id="growth-desc">An illustrative scenario in three stages. Startup: two founders, one repository, every seat with a twin, one-page artefacts. Scaleup: a lean team, a second product stream in its own repository, people paired with the risky-layer seats, agents earning autonomy on safe layers. Enterprise: several product streams, people paired where the company needs a named owner, full artefacts. Across all three, the floors, the evidence rule, and the human-only gates stay the same.</desc>
<defs><marker id="arrow-growth" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5bd1"/></marker></defs>
<rect width="460" height="930" fill="#ffffff"/>
<rect x="12" y="12" width="436" height="250" rx="12" fill="#f5f6f8" stroke="#d9dde4" stroke-width="1.5"/>
<circle cx="36" cy="36" r="13" fill="#1f5bd1"/>
<text x="36" y="41" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
<text x="58" y="42" font-size="17" fill="#1d2330" font-weight="bold" text-anchor="start">Startup: the MVP</text>
<text x="26" y="64" font-size="12.5" fill="#535b6b" font-weight="normal" text-anchor="start" font-style="italic">[team] stage = startup, up to 15 people</text>
<rect x="22" y="74" width="416" height="62" rx="6" fill="#fdf6e3" stroke="#9a6700" stroke-width="1"/>
<text x="32" y="91" font-size="12.5" fill="#9a6700" font-weight="bold" text-anchor="start">People</text>
<text x="88" y="91" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Two founders, each paired with a seat, so</text>
<text x="88" y="109" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">each reviews the other and neither can use</text>
<text x="88" y="127" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">the solo-mode bypass.</text>
<rect x="22" y="142" width="416" height="44" rx="6" fill="#eef3fd" stroke="#1f5bd1" stroke-width="1"/>
<text x="32" y="159" font-size="12.5" fill="#1f5bd1" font-weight="bold" text-anchor="start">Pods</text>
<text x="88" y="159" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">One product, one repository, one pod of</text>
<text x="88" y="177" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">fourteen seats.</text>
<rect x="22" y="192" width="416" height="62" rx="6" fill="#f3f0fa" stroke="#6941c6" stroke-width="1"/>
<text x="32" y="209" font-size="12.5" fill="#6941c6" font-weight="bold" text-anchor="start">Twins</text>
<text x="88" y="209" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Every seat has a twin; most run solo. They</text>
<text x="88" y="227" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">write the one-page versions: a press note, a</text>
<text x="88" y="245" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">test plan, a retro note.</text>
<line x1="230.0" y1="262" x2="230.0" y2="286" stroke="#1f5bd1" stroke-width="2" marker-end="url(#arrow-growth)"/>
<rect x="12" y="290" width="436" height="268" rx="12" fill="#f5f6f8" stroke="#d9dde4" stroke-width="1.5"/>
<circle cx="36" cy="314" r="13" fill="#1f5bd1"/>
<text x="36" y="319" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
<text x="58" y="320" font-size="17" fill="#1d2330" font-weight="bold" text-anchor="start">Scaleup: a second stream</text>
<text x="26" y="342" font-size="12.5" fill="#535b6b" font-weight="normal" text-anchor="start" font-style="italic">up to 150 people</text>
<rect x="22" y="352" width="416" height="62" rx="6" fill="#fdf6e3" stroke="#9a6700" stroke-width="1"/>
<text x="32" y="369" font-size="12.5" fill="#9a6700" font-weight="bold" text-anchor="start">People</text>
<text x="88" y="369" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">A lean team. People pair with the risky-</text>
<text x="88" y="387" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">layer seats first: Quality, Production, and</text>
<text x="88" y="405" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Platform.</text>
<rect x="22" y="420" width="416" height="62" rx="6" fill="#eef3fd" stroke="#1f5bd1" stroke-width="1"/>
<text x="32" y="437" font-size="12.5" fill="#1f5bd1" font-weight="bold" text-anchor="start">Pods</text>
<text x="88" y="437" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">A second product in its own repository, with</text>
<text x="88" y="455" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">its own pod. The founders watch both with</text>
<text x="88" y="473" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">aayu status --all.</text>
<rect x="22" y="488" width="416" height="62" rx="6" fill="#f3f0fa" stroke="#6941c6" stroke-width="1"/>
<text x="32" y="505" font-size="12.5" fill="#6941c6" font-weight="bold" text-anchor="start">Twins</text>
<text x="88" y="505" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Safe layers earn autonomy after 20 clean</text>
<text x="88" y="523" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">merges. The artefacts grow: a PR/FAQ, a test</text>
<text x="88" y="541" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">strategy, a delivery review.</text>
<line x1="230.0" y1="558" x2="230.0" y2="582" stroke="#1f5bd1" stroke-width="2" marker-end="url(#arrow-growth)"/>
<rect x="12" y="586" width="436" height="250" rx="12" fill="#f5f6f8" stroke="#d9dde4" stroke-width="1.5"/>
<circle cx="36" cy="610" r="13" fill="#1f5bd1"/>
<text x="36" y="615" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
<text x="58" y="616" font-size="17" fill="#1d2330" font-weight="bold" text-anchor="start">Enterprise: widely used</text>
<text x="26" y="638" font-size="12.5" fill="#535b6b" font-weight="normal" text-anchor="start" font-style="italic">more than 150 people</text>
<rect x="22" y="648" width="416" height="62" rx="6" fill="#fdf6e3" stroke="#9a6700" stroke-width="1"/>
<text x="32" y="665" font-size="12.5" fill="#9a6700" font-weight="bold" text-anchor="start">People</text>
<text x="88" y="665" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Each stream keeps a small group of people,</text>
<text x="88" y="683" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">paired where the company needs a named</text>
<text x="88" y="701" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">owner, such as Audit.</text>
<rect x="22" y="716" width="416" height="44" rx="6" fill="#eef3fd" stroke="#1f5bd1" stroke-width="1"/>
<text x="32" y="733" font-size="12.5" fill="#1f5bd1" font-weight="bold" text-anchor="start">Pods</text>
<text x="88" y="733" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Several product streams, one repository and</text>
<text x="88" y="751" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">one pod each, on one fleet.</text>
<rect x="22" y="766" width="416" height="62" rx="6" fill="#f3f0fa" stroke="#6941c6" stroke-width="1"/>
<text x="32" y="783" font-size="12.5" fill="#6941c6" font-weight="bold" text-anchor="start">Twins</text>
<text x="88" y="783" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">Twins keep doing the work, now writing the</text>
<text x="88" y="801" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">full artefacts: a working-backwards</text>
<text x="88" y="819" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">document, a master test plan.</text>
<rect x="12" y="848" width="436" height="70" rx="12" fill="#eef1f6" stroke="#535b6b" stroke-width="2"/>
<text x="26" y="872" font-size="15" fill="#1d2330" font-weight="bold" text-anchor="start">Never changes at any stage</text>
<text x="26" y="892" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">The floors, the evidence rule, and the steps</text>
<text x="26" y="910" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">only a person may take.</text>
</svg>
