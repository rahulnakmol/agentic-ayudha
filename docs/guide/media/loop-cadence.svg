<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1258" width="460" height="1258" role="img" aria-labelledby="cadence-title cadence-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="cadence-title">Four loops inside each other, and the scheduled loops that keep them moving</title>
<desc id="cadence-desc">The checkpoint loop builds and checks one layer at a time. The review loop sends a pull request back to its builder at most twice before a person decides. The story loop takes a Ready story to a merge. The goal loop releases the stories, measures the Goal, and starts the next one. Below, scheduled loops run each weekday, each night, each week, and each month, each run by a seat's twin, or by GitHub Actions when no model is needed; a person approves anything they cannot.</desc>
<defs><marker id="arrow-cadence" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5bd1"/></marker></defs>
<rect width="460" height="1258" fill="#ffffff"/>
<rect x="12" y="12" width="436" height="398" rx="12" fill="#eef3fd" stroke="#1f5bd1" stroke-width="2"/>
<text x="26" y="36" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start">Goal loop</text>
<text x="434" y="36" font-size="13" fill="#535b6b" font-weight="normal" text-anchor="end" font-style="italic">weeks</text>
<text x="26" y="58" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Shape a Goal, release its stories, measure it</text>
<text x="26" y="76" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">against the baseline, start the next.</text>
<rect x="26" y="92" width="408" height="300" rx="12" fill="#f3f0fa" stroke="#6941c6" stroke-width="2"/>
<text x="40" y="116" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start">Story loop</text>
<text x="420" y="116" font-size="13" fill="#535b6b" font-weight="normal" text-anchor="end" font-style="italic">a story you can build in a day</text>
<text x="40" y="138" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Ready, build, prove, then a person's yes</text>
<text x="40" y="156" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">and ship.</text>
<rect x="40" y="172" width="380" height="202" rx="12" fill="#fdf0ec" stroke="#b4441d" stroke-width="2"/>
<text x="54" y="196" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start">Review loop</text>
<text x="406" y="196" font-size="13" fill="#535b6b" font-weight="normal" text-anchor="end" font-style="italic">each push</text>
<text x="54" y="218" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">The merge gate runs; inspect says fix;</text>
<text x="54" y="236" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">the builder fixes. After 2 rounds, a</text>
<text x="54" y="254" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">person decides.</text>
<rect x="54" y="270" width="352" height="86" rx="12" fill="#edf7ee" stroke="#2e7d32" stroke-width="2"/>
<text x="68" y="294" font-size="16" fill="#1d2330" font-weight="bold" text-anchor="start">Checkpoint loop</text>
<text x="392" y="294" font-size="13" fill="#535b6b" font-weight="normal" text-anchor="end" font-style="italic">each layer</text>
<text x="68" y="316" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">Build one layer, run verify, commit</text>
<text x="68" y="334" font-size="14" fill="#1d2330" font-weight="normal" text-anchor="start">the checkpoint, go on.</text>
<text x="12" y="436" font-size="17" fill="#1d2330" font-weight="bold" text-anchor="start">Scheduled loops</text>
<text x="12" y="456" font-size="13.5" fill="#535b6b" font-weight="normal" text-anchor="start">Agent loops run in your agent's own scheduler, as you.</text>
<text x="12" y="474" font-size="13.5" fill="#535b6b" font-weight="normal" text-anchor="start">Loops that need no model run in GitHub Actions.</text>
