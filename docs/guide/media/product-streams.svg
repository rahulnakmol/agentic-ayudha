<rect x="22" y="490" width="192.0" height="30" rx="6" fill="#f3f0fa" stroke="#6941c6" stroke-width="1"/>
<text x="32" y="510" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">14 seats, 14 twins</text>
<rect x="22" y="526" width="192.0" height="32" rx="6" fill="#fdf6e3" stroke="#9a6700" stroke-width="1"/>
<text x="32" y="547" font-size="13" fill="#1d2330" font-weight="normal" text-anchor="start">its own people</text>
<rect x="236.0" y="436" width="212.0" height="132" rx="12" fill="#eef1f6" stroke="#535b6b" stroke-width="2"/>
<text x="248.0" y="464" font-size="13.5" fill="#1d2330" font-weight="bold" text-anchor="start">Same in every pod:</text>
<text x="248.0" y="486" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">the floors, the</text>
<text x="248.0" y="508" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">evidence rule, the</text>
<text x="248.0" y="530" font-size="13.5" fill="#1d2330" font-weight="normal" text-anchor="start">human-only steps</text>
</svg>
