<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 564" width="460" height="564" role="img" aria-labelledby="integrations-title integrations-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="integrations-title">Analytics and error data enter the loop read-only: PostHog and Sentry feed Shape and Learn, and production questions become queries a person runs</title>
<desc id="integrations-desc">PostHog and Sentry connect with read-only keys that aayu checks before any data call. They feed the baseline when grill shapes a Goal, and measure when Learn compares the Goal with that baseline. PostHog feeds experiment, and PostHog or GrowthBook feeds readout. In production, investigate and runbook write bounded hogql and sentry query templates for a person to run; aayu does not call the providers there. aayu never writes to either provider.</desc>
