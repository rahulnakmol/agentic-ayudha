<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 1102" width="460" height="1102" role="img" aria-labelledby="team-title team-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title id="team-title">Fourteen seats, each with a named agent twin, in five groups around the founder</title>
<desc id="team-desc">The founder, a person, sits at the top with Atri, the twin that counsels but never decides. Below, thirteen seats in five groups: decide what to build (Arjun, Hanu, Kuber), shape the system (Vishwa, Shuka), build, prove, and ship (Nakul, Yama, Drona), release and run (Nala, Shesha), and explain and check (Sanjay, Sauti, Vidhi). Each card names the layers the seat owns and some of its verbs. Every seat runs solo, its twin alone, until you pair a person with it.</desc>
<defs><marker id="arrow-team" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f5bd1"/></marker></defs>
